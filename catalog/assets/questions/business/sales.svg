<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 346" role="img" aria-labelledby="title"><title id="title">同一門市三個月銷售紀錄</title><rect width="100%" height="100%" fill="#fff"/><g font-family="sans-serif" fill="#18383d"><text x="30" y="42" font-size="28">同一門市三個月銷售紀錄</text><rect x="25" y="65" width="850" height="48" rx="8" fill="#e3f3ed"/><text x="40.0" y="96" font-size="23">月份</text><text x="320.0" y="96" font-size="23">營收（萬元）</text><text x="600.0" y="96" font-size="23">訂單數</text><text x="40.0" y="145" font-size="23">一月</text><text x="320.0" y="145" font-size="23">100</text><text x="600.0" y="145" font-size="23">50</text><path d="M30 161 H870" stroke="#d5dfdf"/><text x="40.0" y="207" font-size="23">二月</text><text x="320.0" y="207" font-size="23">150</text><text x="600.0" y="207" font-size="23">100</text><path d="M30 223 H870" stroke="#d5dfdf"/><text x="40.0" y="269" font-size="23">三月</text><text x="320.0" y="269" font-size="23">120</text><text x="600.0" y="269" font-size="23">60</text><path d="M30 285 H870" stroke="#d5dfdf"/><text x="30" y="326" font-size="19">每筆訂單僅計一次；營收皆為新臺幣，已扣除退貨。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 346" role="img" aria-labelledby="title"><title id="title">訂單明細與維度關聯</title><rect width="100%" height="100%" fill="#fff"/><g font-family="sans-serif" fill="#18383d"><text x="30" y="42" font-size="28">訂單明細與維度關聯</text><rect x="25" y="65" width="850" height="48" rx="8" fill="#e3f3ed"/><text x="40.0" y="96" font-size="23">資料表</text><text x="320.0" y="96" font-size="23">一列代表</text><text x="600.0" y="96" font-size="23">鍵／度量</text><text x="40.0" y="145" font-size="23">日期維度</text><text x="320.0" y="145" font-size="23">一天</text><text x="600.0" y="145" font-size="23">日期鍵（唯一）</text><path d="M30 161 H870" stroke="#d5dfdf"/><text x="40.0" y="207" font-size="23">產品維度</text><text x="320.0" y="207" font-size="23">一項產品</text><text x="600.0" y="207" font-size="23">產品鍵（唯一）</text><path d="M30 223 H870" stroke="#d5dfdf"/><text x="40.0" y="269" font-size="23">銷售事實</text><text x="320.0" y="269" font-size="23">一張訂單的一項明細</text><text x="600.0" y="269" font-size="23">日期鍵、產品鍵、金額</text><path d="M30 285 H870" stroke="#d5dfdf"/><text x="30" y="326" font-size="19">日期維度 1 → 多筆銷售；產品維度 1 → 多筆銷售。</text></g></svg>
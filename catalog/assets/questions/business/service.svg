<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 284" role="img" aria-labelledby="title"><title id="title">客服流程改版前後的觀察</title><rect width="100%" height="100%" fill="#fff"/><g font-family="sans-serif" fill="#18383d"><text x="30" y="42" font-size="28">客服流程改版前後的觀察</text><rect x="25" y="65" width="850" height="48" rx="8" fill="#e3f3ed"/><text x="40.0" y="96" font-size="23">期間</text><text x="320.0" y="96" font-size="23">已結案件數</text><text x="600.0" y="96" font-size="23">總處理分鐘</text><text x="40.0" y="145" font-size="23">改版前</text><text x="320.0" y="145" font-size="23">100</text><text x="600.0" y="145" font-size="23">800</text><path d="M30 161 H870" stroke="#d5dfdf"/><text x="40.0" y="207" font-size="23">改版後</text><text x="320.0" y="207" font-size="23">120</text><text x="600.0" y="207" font-size="23">720</text><path d="M30 223 H870" stroke="#d5dfdf"/><text x="30" y="264" font-size="19">兩期各一週；案件難度與人力可能不同，尚未做控制實驗。</text></g></svg>
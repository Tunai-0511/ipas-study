<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">TGA 分段失重與氣氛切換</title><desc id="desc">TGA起始20mg、150°C氮氣19mg、600°C氮氣8mg、切換空氣後2mg；題定低溫只揮發、空氣燃殘炭、無機填料穩定。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277b91"/></marker></defs><rect width="1100" height="720" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#18364a" text-anchor="start">TGA 分段失重與氣氛切換</text><line x1="85" y1="245" x2="1000" y2="245" stroke="#254f68" stroke-width="3"/><line x1="85" y1="245" x2="85" y2="110" stroke="#254f68" stroke-width="3"/><text x="65" y="100" font-size="19" fill="#18364a" text-anchor="start">質量 / mg</text><polyline points="110.0,130.0 393.3333333333333,135.27777777777777 676.6666666666666,193.33333333333334 960.0,225.0" fill="none" stroke="#b55735" stroke-width="4"/><circle cx="110.0" cy="130.0" r="6" fill="#b55735"/><text x="110.0" y="118.0" font-size="20" fill="#18364a" text-anchor="middle">20</text><text x="110.0" y="276" font-size="19" fill="#18364a" text-anchor="middle">起始</text><circle cx="393.3333333333333" cy="135.27777777777777" r="6" fill="#b55735"/><text x="393.3333333333333" y="123.27777777777777" font-size="20" fill="#18364a" text-anchor="middle">19</text><text x="393.3333333333333" y="276" font-size="19" fill="#18364a" text-anchor="middle">150°C/N₂</text><circle cx="676.6666666666666" cy="193.33333333333334" r="6" fill="#b55735"/><text x="676.6666666666666" y="181.33333333333334" font-size="20" fill="#18364a" text-anchor="middle">8</text><text x="676.6666666666666" y="276" font-size="19" fill="#18364a" text-anchor="middle">600°C/N₂</text><circle cx="960.0" cy="225.0" r="6" fill="#b55735"/><text x="960.0" y="213.0" font-size="20" fill="#18364a" text-anchor="middle">2</text><text x="960.0" y="276" font-size="19" fill="#18364a" text-anchor="middle">600°C/空氣</text><rect x="40" y="290" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="55" y="328" font-size="21" fill="#18364a" text-anchor="start">條件</text><rect x="550.0" y="290" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="565.0" y="328" font-size="21" fill="#18364a" text-anchor="start">本題解讀假設</text><rect x="40" y="350" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="388" font-size="21" fill="#18364a" text-anchor="start">起始質量</text><rect x="550.0" y="350" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="388" font-size="21" fill="#18364a" text-anchor="start">20.0 mg</text><rect x="40" y="410" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="448" font-size="21" fill="#18364a" text-anchor="start">至150°C</text><rect x="550.0" y="410" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="448" font-size="21" fill="#18364a" text-anchor="start">低沸點揮發物離開，無其他反應</text><rect x="40" y="470" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="508" font-size="21" fill="#18364a" text-anchor="start">N₂ 600°C → 空氣600°C</text><rect x="550.0" y="470" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="508" font-size="21" fill="#18364a" text-anchor="start">可燃殘炭氧化；無機填料不失重</text><rect x="40" y="530" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="568" font-size="21" fill="#18364a" text-anchor="start">空氣段後再升溫</text><rect x="550.0" y="530" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="568" font-size="21" fill="#18364a" text-anchor="start">殘重穩定2.0 mg</text><text x="40" y="690" font-size="19" fill="#556c79" text-anchor="start">原創練習數據；圖中尺寸、材料與允收條件均為本題設定。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">雙材料換料與支撐介面試驗</title><desc id="desc">每次換料清洗200mm³、8次、密度1.25g/cm³，零件與支撐淨重25g；清洗不足介面殘留與強度波動，經驗證清洗改善。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277b91"/></marker></defs><rect width="1100" height="720" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#18364a" text-anchor="start">雙材料換料與支撐介面試驗</text><rect x="40" y="290" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="55" y="328" font-size="21" fill="#18364a" text-anchor="start">項目</text><rect x="550.0" y="290" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="565.0" y="328" font-size="21" fill="#18364a" text-anchor="start">數值 / 觀察</text><rect x="40" y="350" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="388" font-size="21" fill="#18364a" text-anchor="start">每次換料清洗量 / 換料次數</text><rect x="550.0" y="350" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="388" font-size="21" fill="#18364a" text-anchor="start">200 mm³ / 8次</text><rect x="40" y="410" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="448" font-size="21" fill="#18364a" text-anchor="start">材料密度 / 零件加支撐淨重</text><rect x="550.0" y="410" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="448" font-size="21" fill="#18364a" text-anchor="start">1.25 g/cm³ / 25 g</text><rect x="40" y="470" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="508" font-size="21" fill="#18364a" text-anchor="start">介面試驗甲：清洗量不足</text><rect x="550.0" y="470" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="508" font-size="21" fill="#18364a" text-anchor="start">前材料殘留，介面強度波動</text><rect x="40" y="530" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="568" font-size="21" fill="#18364a" text-anchor="start">介面試驗乙：依驗證清洗量</text><rect x="550.0" y="530" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="568" font-size="21" fill="#18364a" text-anchor="start">殘留降低，介面強度較穩定</text><rect x="175.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="290.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">材料1</text><path d="M405.0,165 L427.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="435.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="550.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">換料清洗區</text><path d="M665.0,165 L687.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="695.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="810.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">材料2 / 支撐介面</text><text x="40" y="690" font-size="19" fill="#556c79" text-anchor="start">原創練習數據；圖中尺寸、材料與允收條件均為本題設定。</text></g></svg>
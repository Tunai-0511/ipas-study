<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">材料擠製製程優化：2×2試驗</title><desc id="desc">同材料同試件2×2試驗：200°C/30%風扇30MPa、220/30%42、200/80%22、220/80%26；各組有同數量重複。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277b91"/></marker></defs><rect width="1100" height="720" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#18364a" text-anchor="start">材料擠製製程優化：2×2試驗</text><rect x="175.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="290.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">溫度 × 冷卻</text><path d="M405.0,165 L427.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="435.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="550.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">相同材料 / 試件</text><path d="M665.0,165 L687.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="695.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="810.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">同向拉伸試驗</text><rect x="40" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="55" y="328" font-size="21" fill="#18364a" text-anchor="start">組別</text><rect x="295.0" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="310.0" y="328" font-size="21" fill="#18364a" text-anchor="start">噴嘴溫度</text><rect x="550.0" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="565.0" y="328" font-size="21" fill="#18364a" text-anchor="start">風扇設定</text><rect x="805.0" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="820.0" y="328" font-size="21" fill="#18364a" text-anchor="start">強度均值</text><rect x="40" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="388" font-size="21" fill="#18364a" text-anchor="start">P</text><rect x="295.0" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="388" font-size="21" fill="#18364a" text-anchor="start">200 °C</text><rect x="550.0" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="388" font-size="21" fill="#18364a" text-anchor="start">30%</text><rect x="805.0" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="820.0" y="388" font-size="21" fill="#18364a" text-anchor="start">30 MPa</text><rect x="40" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="448" font-size="21" fill="#18364a" text-anchor="start">Q</text><rect x="295.0" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="448" font-size="21" fill="#18364a" text-anchor="start">220 °C</text><rect x="550.0" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="448" font-size="21" fill="#18364a" text-anchor="start">30%</text><rect x="805.0" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="820.0" y="448" font-size="21" fill="#18364a" text-anchor="start">42 MPa</text><rect x="40" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="508" font-size="21" fill="#18364a" text-anchor="start">R</text><rect x="295.0" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="508" font-size="21" fill="#18364a" text-anchor="start">200 °C</text><rect x="550.0" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="508" font-size="21" fill="#18364a" text-anchor="start">80%</text><rect x="805.0" y="470" width="255.0" height
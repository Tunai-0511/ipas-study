<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">工具機固定塊：盲孔剖面</title><desc id="desc">固定塊厚30mm，剖面示意直徑10mm、深20mm的理想平底盲孔，不含鑽尖錐體。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277b91"/></marker></defs><rect width="1100" height="720" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#18364a" text-anchor="start">工具機固定塊：盲孔剖面</text><path d="M190 120 H475 V210 H625 V120 H910 V260 H190 Z" fill="#cbdde8" stroke="#254f68" stroke-width="3"/><line x1="550" y1="95" x2="550" y2="275" stroke="#254f68" stroke-width="3" stroke-dasharray="8 6"/><text x="550" y="110" font-size="23" fill="#18364a" text-anchor="middle">Ø10</text><text x="950" y="195" font-size="23" fill="#18364a" text-anchor="start">30 mm</text><text x="640" y="192" font-size="23" fill="#18364a" text-anchor="start">深20 mm</text><text x="200" y="290" font-size="19" fill="#18364a" text-anchor="start">剖面示意，尺寸以標註為準</text><rect x="40" y="335" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="55" y="373" font-size="21" fill="#18364a" text-anchor="start">項目</text><rect x="550.0" y="335" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="565.0" y="373" font-size="21" fill="#18364a" text-anchor="start">數值 / 條件</text><rect x="40" y="395" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="433" font-size="21" fill="#18364a" text-anchor="start">塊體厚度</text><rect x="550.0" y="395" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="433" font-size="21" fill="#18364a" text-anchor="start">30 mm</text><rect x="40" y="455" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="493" font-size="21" fill="#18364a" text-anchor="start">平底盲孔直徑 / 深度</text><rect x="550.0" y="455" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="493" font-size="21" fill="#18364a" text-anchor="start">10 mm / 20 mm</text><rect x="40" y="515" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="553" font-size="21" fill="#18364a" text-anchor="start">本題孔底形狀</text><rect x="550.0" y="515" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="553" font-size="21" fill="#18364a" text-anchor="start">理想平底，不含鑽尖錐體</text><rect x="40" y="575" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="613" font-size="21" fill="#18364a" text-anchor="start">體積計算</text><rect x="550.0" y="575" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="613" font-size="21" fill="#18364a" text-anchor="start">圓柱V=πd²h/4</text><text x="40" y="690" font-size="19" fill="#556c79" text-anchor="start">原創練習數據；圖中尺寸、材料與允收條件均為本題設定。</text></g></svg>
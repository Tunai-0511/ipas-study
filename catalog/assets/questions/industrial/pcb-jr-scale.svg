<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">切片顯微影像的比例校正</title><desc id="desc">100微米刻度對應250像素；孔壁上中下60、50、70像素，練習最低銅厚18微米。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277b91"/></marker></defs><rect width="1100" height="720" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#18364a" text-anchor="start">切片顯微影像的比例校正</text><rect x="175.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="290.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">刻度片</text><path d="M405.0,165 L427.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="435.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="550.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">相同物鏡影像</text><path d="M665.0,165 L687.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="695.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="810.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">孔壁銅測量</text><rect x="40" y="290" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="55" y="328" font-size="21" fill="#18364a" text-anchor="start">影像測量</text><rect x="550.0" y="290" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="565.0" y="328" font-size="21" fill="#18364a" text-anchor="start">數值</text><rect x="40" y="350" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="388" font-size="21" fill="#18364a" text-anchor="start">刻度片真實長度</text><rect x="550.0" y="350" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="388" font-size="21" fill="#18364a" text-anchor="start">100 μm</text><rect x="40" y="410" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="448" font-size="21" fill="#18364a" text-anchor="start">同一段刻度片像素長度</text><rect x="550.0" y="410" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="448" font-size="21" fill="#18364a" text-anchor="start">250 px</text><rect x="40" y="470" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="508" font-size="21" fill="#18364a" text-anchor="start">孔壁銅厚：上 / 中 / 下</text><rect x="550.0" y="470" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="508" font-size="21" fill="#18364a" text-anchor="start">60 / 50 / 70 px</text><rect x="40" y="530" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="568" font-size="21" fill="#18364a" text-anchor="start">練習允收規格</text><rect x="550.0" y="530" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="568" font-size="21" fill="#18364a" text-anchor="start">各測點銅厚 ≥ 18 μm</text><text x="40" y="690" font-size="19" fill="#556c79" text-anchor="start">原創練習數據；圖中尺寸、材料與允收條件均為本題設定。</text></g></svg>
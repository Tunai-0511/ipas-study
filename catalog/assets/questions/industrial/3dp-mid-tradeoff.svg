<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">材料與切片方案的多目標比較</title><desc id="desc">甲乙丙丁強度45/50/42/48MPa，用料12/10/14/11g，時間40/65/35/50min；材料2元/g，機時0.2元/min，功率0.12kW。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277b91"/></marker></defs><rect width="1100" height="720" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#18364a" text-anchor="start">材料與切片方案的多目標比較</text><rect x="40" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="55" y="328" font-size="21" fill="#18364a" text-anchor="start">方案</text><rect x="295.0" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="310.0" y="328" font-size="21" fill="#18364a" text-anchor="start">拉伸強度</text><rect x="550.0" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="565.0" y="328" font-size="21" fill="#18364a" text-anchor="start">用料質量</text><rect x="805.0" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="820.0" y="328" font-size="21" fill="#18364a" text-anchor="start">列印時間</text><rect x="40" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="388" font-size="21" fill="#18364a" text-anchor="start">甲</text><rect x="295.0" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="388" font-size="21" fill="#18364a" text-anchor="start">45 MPa</text><rect x="550.0" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="388" font-size="21" fill="#18364a" text-anchor="start">12 g</text><rect x="805.0" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="820.0" y="388" font-size="21" fill="#18364a" text-anchor="start">40 min</text><rect x="40" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="448" font-size="21" fill="#18364a" text-anchor="start">乙</text><rect x="295.0" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="448" font-size="21" fill="#18364a" text-anchor="start">50 MPa</text><rect x="550.0" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="448" font-size="21" fill="#18364a" text-anchor="start">10 g</text><rect x="805.0" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="820.0" y="448" font-size="21" fill="#18364a" text-anchor="start">65 min</text><rect x="40" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="508" font-size="21" fill="#18364a" text-anchor="start">丙</text><rect x="295.0" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="508" font-size="21" fill="#18364a" text-anchor="start">42 MPa</text><rect x="550.0" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="508" font-size="21" fill="#18364a" text-anchor="start">14 g</text><rect x="805.0" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="820.0" y="508" font-size="21" fill="#18364a" text-anchor="start">35 min</text><rect x="40" y="530" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="568" font-size="21" fill="#18364a" text-anchor="start">丁</text><rect x="295.0" y="530" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="568" font-size="21" fill="#18364a" text-anchor="start">48 MPa</text><rect x="550.0" y="530" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="568" font-size="21" fill="#18364a" text-anchor="start">11 g</text><rect x="805.0" y="530" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="820.0" y="568" font-size="21" fill="#18364a" text-anchor="start">50 m
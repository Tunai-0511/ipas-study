<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">中空件擺放方案與排液</title><desc id="desc">同一中空件P/Q/R三方案：最大截面800/300/100 mm²、高度20/35/60 mm，P無排液孔，Q/R有；限制350 mm²、40 mm與有排液孔。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277b91"/></marker></defs><rect width="1100" height="720" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#18364a" text-anchor="start">中空件擺放方案與排液</text><rect x="175.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="290.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">列印平台</text><path d="M405.0,165 L427.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="435.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="550.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">傾斜件 + 支撐</text><path d="M665.0,165 L687.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="695.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="810.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">底部排液孔</text><rect x="40" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="55" y="328" font-size="21" fill="#18364a" text-anchor="start">方案</text><rect x="295.0" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="310.0" y="328" font-size="21" fill="#18364a" text-anchor="start">最大層截面</text><rect x="550.0" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="565.0" y="328" font-size="21" fill="#18364a" text-anchor="start">建構高度</text><rect x="805.0" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="820.0" y="328" font-size="21" fill="#18364a" text-anchor="start">排液孔</text><rect x="40" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="388" font-size="21" fill="#18364a" text-anchor="start">平放 P</text><rect x="295.0" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="388" font-size="21" fill="#18364a" text-anchor="start">800 mm²</text><rect x="550.0" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="388" font-size="21" fill="#18364a" text-anchor="start">20 mm</text><rect x="805.0" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="820.0" y="388" font-size="21" fill="#18364a" text-anchor="start">無</text><rect x="40" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="448" font-size="21" fill="#18364a" text-anchor="start">傾斜 Q</text><rect x="295.0" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="448" font-size="21" fill="#18364a" text-anchor="start">300 mm²</text><rect x="550.0" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="448" font-size="21" fill="#18364a" text-anchor="start">35 mm</text><rect x="805.0" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="820.0" y="448" font-size="21" fill="#18364a" text-anchor="start">有</text><rect x="40" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="508" font-size="21" fill="#18364a" text-anchor="start">直立 R</text><rect x="295.0" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="508" font-size="21" fill="#18364a" text-anchor="start">100 mm²</text><rect x="550.0" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="508" font-size="21" fill="#18364a" text-anchor="start">60 mm</text><rect x="805.0" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="820.0" y="508" font-size="21" fill="#18364a" text-anchor="start">有</text><rect x="40" y="530" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="568" font-size="21" fill="#18364a" text-anchor="start">本題限制</text><rect x="295.0" y="530" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="568" font-size="21" fill="#18364a" text-anchor="start">≤350 mm²</text><rect x="550.0" y="530" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="568" font-size="21" fill="#18364a" text-anchor="start">≤40 mm</text><rect x="805.0" y="530" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="820.0" y="568" font-size="21" fill="#18364a" text-anchor="start">必須有</text><text x="40" y="690" font-size="19" fill="#556c79" text-anchor="start">原創練習數據；圖中尺寸、材料與允收條件均為本題設定。</text></g></svg>
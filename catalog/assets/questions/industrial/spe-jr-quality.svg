<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">品質追溯與不良原因彙整</title><desc id="desc">檢查200件，40件不良互斥分類：尺寸18、刮傷12、缺件6、標示4，並附換刀、搬運、投料、工單切換追溯資訊。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277b91"/></marker></defs><rect width="1100" height="720" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#18364a" text-anchor="start">品質追溯與不良原因彙整</text><rect x="40" y="290" width="340.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="55" y="328" font-size="21" fill="#18364a" text-anchor="start">不良原因</text><rect x="380.0" y="290" width="340.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="395.0" y="328" font-size="21" fill="#18364a" text-anchor="start">件數</text><rect x="720.0" y="290" width="340.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="735.0" y="328" font-size="21" fill="#18364a" text-anchor="start">追溯資訊</text><rect x="40" y="350" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="388" font-size="21" fill="#18364a" text-anchor="start">尺寸超差</text><rect x="380.0" y="350" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="395.0" y="388" font-size="21" fill="#18364a" text-anchor="start">18</text><rect x="720.0" y="350" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="735.0" y="388" font-size="21" fill="#18364a" text-anchor="start">集中於換刀後批次</text><rect x="40" y="410" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="448" font-size="21" fill="#18364a" text-anchor="start">表面刮傷</text><rect x="380.0" y="410" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="395.0" y="448" font-size="21" fill="#18364a" text-anchor="start">12</text><rect x="720.0" y="410" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="735.0" y="448" font-size="21" fill="#18364a" text-anchor="start">多出現在同一搬運站</text><rect x="40" y="470" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="508" font-size="21" fill="#18364a" text-anchor="start">缺件</text><rect x="380.0" y="470" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="395.0" y="508" font-size="21" fill="#18364a" text-anchor="start">6</text><rect x="720.0" y="470" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="735.0" y="508" font-size="21" fill="#18364a" text-anchor="start">組裝投料檢查紀錄異常</text><rect x="40" y="530" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="568" font-size="21" fill="#18364a" text-anchor="start">標示錯誤</text><rect x="380.0" y="530" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="395.0" y="568" font-size="21" fill="#18364a" text-anchor="start">4</text><rect x="720.0" y="530" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="735.0" y="568" font-size="21" fill="#18364a" text-anchor="start">集中於工單切換</text><rect x="175.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="290.0" y="159.0" font-size="21" fill="#18364a" text-anchor="middle">批號</text><text x="290.0" y="186.0" font-size="21" fill="#18364a" text-anchor="middle">時間 / 工單</text><path d="M405.0,165 L427.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="435.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="550.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">量測 + 不良分類</text><path d="M665.0,165 L687.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="695.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="810.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">原因對照改善</text><text x="550" y="238" font-size="22" fill="#18364a" text-anchor="middle">本班檢查200件；表內40件各歸一種主要不良原因，沒有重複計數。</text><text x="40" y="690" font-size="19" fill="#556c79" text-anchor="start">原創練習數據；圖中尺寸、材料與允收條件均為本題設定。</text></g></svg>
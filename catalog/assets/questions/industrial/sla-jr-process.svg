<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">本批樹脂的後處理作業卡</title><desc id="desc">本批樹脂作業卡：清洗10分鐘、乾燥15分鐘、後固化20分鐘60°C；另觀察清洗液飽和且表面殘留液態樹脂。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277b91"/></marker></defs><rect width="1100" height="720" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#18364a" text-anchor="start">本批樹脂的後處理作業卡</text><rect x="175.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="290.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">清洗</text><path d="M405.0,165 L427.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="435.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="550.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">完全乾燥</text><path d="M665.0,165 L687.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="695.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="810.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">後固化</text><rect x="40" y="290" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="55" y="328" font-size="21" fill="#18364a" text-anchor="start">步驟 / 狀況</text><rect x="550.0" y="290" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="565.0" y="328" font-size="21" fill="#18364a" text-anchor="start">本題作業卡</text><rect x="40" y="350" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="388" font-size="21" fill="#18364a" text-anchor="start">清洗</text><rect x="550.0" y="350" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="388" font-size="21" fill="#18364a" text-anchor="start">10 min；清洗液須符合使用條件</text><rect x="40" y="410" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="448" font-size="21" fill="#18364a" text-anchor="start">乾燥</text><rect x="550.0" y="410" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="448" font-size="21" fill="#18364a" text-anchor="start">本批實測需15 min</text><rect x="40" y="470" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="508" font-size="21" fill="#18364a" text-anchor="start">後固化</text><rect x="550.0" y="470" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="508" font-size="21" fill="#18364a" text-anchor="start">20 min，依本批規定60 °C</text><rect x="40" y="530" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="568" font-size="21" fill="#18364a" text-anchor="start">觀察</text><rect x="550.0" y="530" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="568" font-size="21" fill="#18364a" text-anchor="start">清洗液已明顯飽和，表面殘留液態樹脂</text><text x="40" y="690" font-size="19" fill="#556c79" text-anchor="start">原創練習數據；圖中尺寸、材料與允收條件均為本題設定。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">工具機治具的線性尺寸鏈</title><desc id="desc">一維尺寸鏈A=D+B+C；A40±0.10、B15±0.05、C10±0.02mm；D推導，不另獨立標公差，採最壞情況。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277b91"/></marker></defs><rect width="1100" height="720" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#18364a" text-anchor="start">工具機治具的線性尺寸鏈</text><line x1="120" y1="170" x2="980" y2="170" stroke="#254f68" stroke-width="3"/><line x1="120" y1="140" x2="120" y2="215" stroke="#254f68" stroke-width="3"/><line x1="500" y1="140" x2="500" y2="215" stroke="#254f68" stroke-width="3"/><line x1="730" y1="140" x2="730" y2="215" stroke="#254f68" stroke-width="3"/><line x1="980" y1="140" x2="980" y2="215" stroke="#254f68" stroke-width="3"/><text x="550" y="125" font-size="24" fill="#18364a" text-anchor="middle">A：總長</text><text x="300" y="205" font-size="22" fill="#18364a" text-anchor="middle">D：剩餘間距</text><text x="615" y="205" font-size="24" fill="#18364a" text-anchor="middle">B</text><text x="855" y="205" font-size="24" fill="#18364a" text-anchor="middle">C</text><rect x="40" y="290" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="55" y="328" font-size="21" fill="#18364a" text-anchor="start">尺寸 / 關係</text><rect x="550.0" y="290" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="565.0" y="328" font-size="21" fill="#18364a" text-anchor="start">圖面規格</text><rect x="40" y="350" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="388" font-size="21" fill="#18364a" text-anchor="start">A：總長</text><rect x="550.0" y="350" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="388" font-size="21" fill="#18364a" text-anchor="start">40.00 ± 0.10 mm</text><rect x="40" y="410" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="448" font-size="21" fill="#18364a" text-anchor="start">B / C</text><rect x="550.0" y="410" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="448" font-size="21" fill="#18364a" text-anchor="start">15.00 ± 0.05 / 10.00 ± 0.02 mm</text><rect x="40" y="470" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="508" font-size="21" fill="#18364a" text-anchor="start">D：由其餘尺寸推得</text><rect x="550.0" y="470" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="508" font-size="21" fill="#18364a" text-anchor="start">D=A−B−C，不另獨立標公差</text><rect x="40" y="530" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="568" font-size="21" fill="#18364a" text-anchor="start">本題分析方法</text><rect x="550.0" y="530" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="568" font-size="21" fill="#18364a" text-anchor="start">最壞情況，尺寸可在各自範圍內獨立變動</text><text x="40" y="690" font-size="19" fill="#556c79" text-anchor="start">原創練習數據；圖中尺寸、材料與允收條件均為本題設定。</text></g></svg>
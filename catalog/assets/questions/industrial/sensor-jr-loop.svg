<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">4–20 mA 壓力傳送器與取樣電阻</title><desc id="desc">壓力0至100 kPa線性對應4至20 mA；取樣電阻250 Ω、電流12 mA；供電24 V，傳送器最低12 V，其他串聯100 Ω。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277b91"/></marker></defs><rect width="1100" height="720" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#18364a" text-anchor="start">4–20 mA 壓力傳送器與取樣電阻</text><rect x="175.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="290.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">壓力傳送器</text><path d="M405.0,165 L427.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="435.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="550.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">250 Ω 精密電阻</text><path d="M665.0,165 L687.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="695.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="810.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">0–5 V ADC</text><text x="550" y="238" font-size="22" fill="#18364a" text-anchor="middle">線性映射：0 kPa → 4 mA；100 kPa → 20 mA</text><rect x="40" y="290" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="55" y="328" font-size="21" fill="#18364a" text-anchor="start">測試點</text><rect x="550.0" y="290" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="565.0" y="328" font-size="21" fill="#18364a" text-anchor="start">讀值</text><rect x="40" y="350" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="388" font-size="21" fill="#18364a" text-anchor="start">量測電流</text><rect x="550.0" y="350" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="388" font-size="21" fill="#18364a" text-anchor="start">12 mA</text><rect x="40" y="410" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="448" font-size="21" fill="#18364a" text-anchor="start">供電電壓 / 傳送器最低工作電壓</text><rect x="550.0" y="410" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="448" font-size="21" fill="#18364a" text-anchor="start">24 V / 12 V</text><rect x="40" y="470" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="508" font-size="21" fill="#18364a" text-anchor="start">電纜與其他串聯總電阻</text><rect x="550.0" y="470" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="508" font-size="21" fill="#18364a" text-anchor="start">100 Ω</text><rect x="40" y="530" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="568" font-size="21" fill="#18364a" text-anchor="start">滿刻度電流</text><rect x="550.0" y="530" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="568" font-size="21" fill="#18364a" text-anchor="start">20 mA</text><text x="40" y="690" font-size="19" fill="#556c79" text-anchor="start">原創練習數據；圖中尺寸、材料與允收條件均為本題設定。</text></g></svg>
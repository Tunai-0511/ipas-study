<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">FDM 試印異常：觀察與對照</title><desc id="desc">甲平台有油污首層翹起，乙清潔後黏附；丙提高速度高速缺料，丁恢复速度缺料消失。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277b91"/></marker></defs><rect width="1100" height="720" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#18364a" text-anchor="start">FDM 試印異常：觀察與對照</text><rect x="40" y="290" width="340.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="55" y="328" font-size="21" fill="#18364a" text-anchor="start">試印</text><rect x="380.0" y="290" width="340.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="395.0" y="328" font-size="21" fill="#18364a" text-anchor="start">條件差異</text><rect x="720.0" y="290" width="340.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="735.0" y="328" font-size="21" fill="#18364a" text-anchor="start">結果</text><rect x="40" y="350" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="388" font-size="21" fill="#18364a" text-anchor="start">甲</text><rect x="380.0" y="350" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="395.0" y="388" font-size="21" fill="#18364a" text-anchor="start">平台油污未清潔</text><rect x="720.0" y="350" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="735.0" y="388" font-size="21" fill="#18364a" text-anchor="start">首層局部翹起</text><rect x="40" y="410" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="448" font-size="21" fill="#18364a" text-anchor="start">乙</text><rect x="380.0" y="410" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="395.0" y="448" font-size="21" fill="#18364a" text-anchor="start">平台清潔；其他同甲</text><rect x="720.0" y="410" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="735.0" y="448" font-size="21" fill="#18364a" text-anchor="start">首層完整黏附</text><rect x="40" y="470" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="508" font-size="21" fill="#18364a" text-anchor="start">丙</text><rect x="380.0" y="470" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="395.0" y="508" font-size="21" fill="#18364a" text-anchor="start">速度提高；材料未變</text><rect x="720.0" y="470" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="735.0" y="508" font-size="21" fill="#18364a" text-anchor="start">高速區線條缺料</text><rect x="40" y="530" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="568" font-size="21" fill="#18364a" text-anchor="start">丁</text><rect x="380.0" y="530" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="395.0" y="568" font-size="21" fill="#18364a" text-anchor="start">速度恢復；其他同丙</text><rect x="720.0" y="530" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="735.0" y="568" font-size="21" fill="#18364a" text-anchor="start">缺料消失</text><rect x="175.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="290.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">首層觀察</text><path d="M405.0,165 L427.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="435.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="550.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">單一變因對照</text><path d="M665.0,165 L687.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="695.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="810.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">量測再驗證</text><text x="40" y="690" font-size="19" fill="#556c79" text-anchor="start">原創練習數據；圖中尺寸、材料與允收條件均為本題設定。</text></g></svg>
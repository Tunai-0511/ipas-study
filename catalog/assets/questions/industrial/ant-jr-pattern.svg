<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">方向圖的相對功率與量測平面</title><desc id="desc">方向圖−30與30度為−3 dB，0度為0 dB，180度為−15 dB；接受100 mW，總輻射60 mW。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277b91"/></marker></defs><rect width="1100" height="720" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#18364a" text-anchor="start">方向圖的相對功率與量測平面</text><line x1="85" y1="245" x2="1000" y2="245" stroke="#254f68" stroke-width="3"/><line x1="85" y1="245" x2="85" y2="110" stroke="#254f68" stroke-width="3"/><text x="65" y="100" font-size="19" fill="#18364a" text-anchor="start">相對功率 / dB</text><polyline points="110.0,225.0 322.5,158.5 535.0,130.0 747.5,158.5 960.0,225.0" fill="none" stroke="#b55735" stroke-width="4"/><circle cx="110.0" cy="225.0" r="6" fill="#b55735"/><text x="110.0" y="213.0" font-size="20" fill="#18364a" text-anchor="middle">-10</text><text x="110.0" y="276" font-size="19" fill="#18364a" text-anchor="middle">−60°</text><circle cx="322.5" cy="158.5" r="6" fill="#b55735"/><text x="322.5" y="146.5" font-size="20" fill="#18364a" text-anchor="middle">-3</text><text x="322.5" y="276" font-size="19" fill="#18364a" text-anchor="middle">−30°</text><circle cx="535.0" cy="130.0" r="6" fill="#b55735"/><text x="535.0" y="118.0" font-size="20" fill="#18364a" text-anchor="middle">0</text><text x="535.0" y="276" font-size="19" fill="#18364a" text-anchor="middle">0°</text><circle cx="747.5" cy="158.5" r="6" fill="#b55735"/><text x="747.5" y="146.5" font-size="20" fill="#18364a" text-anchor="middle">-3</text><text x="747.5" y="276" font-size="19" fill="#18364a" text-anchor="middle">30°</text><circle cx="960.0" cy="225.0" r="6" fill="#b55735"/><text x="960.0" y="213.0" font-size="20" fill="#18364a" text-anchor="middle">-10</text><text x="960.0" y="276" font-size="19" fill="#18364a" text-anchor="middle">60°</text><text x="550" y="100" font-size="21" fill="#18364a" text-anchor="middle">同一頻率、同一極化、同一切面</text><rect x="40" y="290" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="55" y="328" font-size="21" fill="#18364a" text-anchor="start">方向 / 條件</text><rect x="550.0" y="290" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="565.0" y="328" font-size="21" fill="#18364a" text-anchor="start">量測值</text><rect x="40" y="350" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="388" font-size="21" fill="#18364a" text-anchor="start">主波束峰值方向</text><rect x="550.0" y="350" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="388" font-size="21" fill="#18364a" text-anchor="start">0°</text><rect x="40" y="410" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="448" font-size="21" fill="#18364a" text-anchor="start">背向 180°</text><rect x="550.0" y="410" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="448" font-size="21" fill="#18364a" text-anchor="start">−15 dB（相對峰值）</text><rect x="40" y="470" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="508" font-size="21" fill="#18364a" text-anchor="start">饋入接受功率</text><rect x="550.0" y="470" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="508" font-size="21" fill="#18364a" text-anchor="start">100 mW</text><rect x="40" y="530" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="568" font-size="21" fill="#18364a" text-anchor="start">總輻射功率</text><rect x="550.0" y="530" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="568" font-size="21" fill="#18364a" text-anchor="start">60 mW</text><text x="40" y="690" font-size="19" fill="#556c79" text-anchor="start">原創練習數據；圖中尺寸、材料與允收條件均為本題設定。</text></g></svg>
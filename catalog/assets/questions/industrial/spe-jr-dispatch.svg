<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">單機派工：加工時間與交期</title><desc id="desc">三工單時間0到齊，同一機器不搶占、無換線時間；甲工時4交期7，乙工時2交期4，丙工時3交期9，現行甲乙丙。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277b91"/></marker></defs><rect width="1100" height="720" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#18364a" text-anchor="start">單機派工：加工時間與交期</text><rect x="175.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="290.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">時間0全部到齊</text><path d="M405.0,165 L427.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="435.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="550.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">一台機器 / 不搶占</text><path d="M665.0,165 L687.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="695.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="810.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">忽略換線時間</text><rect x="40" y="290" width="340.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="55" y="328" font-size="21" fill="#18364a" text-anchor="start">工單</text><rect x="380.0" y="290" width="340.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="395.0" y="328" font-size="21" fill="#18364a" text-anchor="start">加工時間</text><rect x="720.0" y="290" width="340.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="735.0" y="328" font-size="21" fill="#18364a" text-anchor="start">到期時間</text><rect x="40" y="350" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="388" font-size="21" fill="#18364a" text-anchor="start">甲</text><rect x="380.0" y="350" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="395.0" y="388" font-size="21" fill="#18364a" text-anchor="start">4 h</text><rect x="720.0" y="350" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="735.0" y="388" font-size="21" fill="#18364a" text-anchor="start">7 h</text><rect x="40" y="410" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="448" font-size="21" fill="#18364a" text-anchor="start">乙</text><rect x="380.0" y="410" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="395.0" y="448" font-size="21" fill="#18364a" text-anchor="start">2 h</text><rect x="720.0" y="410" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="735.0" y="448" font-size="21" fill="#18364a" text-anchor="start">4 h</text><rect x="40" y="470" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="508" font-size="21" fill="#18364a" text-anchor="start">丙</text><rect x="380.0" y="470" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="395.0" y="508" font-size="21" fill="#18364a" text-anchor="start">3 h</text><rect x="720.0" y="470" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="735.0" y="508" font-size="21" fill="#18364a" text-anchor="start">9 h</text><rect x="40" y="530" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="568" font-size="21" fill="#18364a" text-anchor="start">現行順序</text><rect x="380.0" y="530" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="395.0" y="568" font-size="21" fill="#18364a" text-anchor="start">甲→乙→丙</text><rect x="720.0" y="530" width="340.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="735.0" y="568" font-size="21" fill="#18364a" text-anchor="start">時間0開始</text><text x="40" y="690" font-size="19" fill="#556c79" text-anchor="start">原創練習數據；圖中尺寸、材料與允收條件均為本題設定。</text></g></svg>
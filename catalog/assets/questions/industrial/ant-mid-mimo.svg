<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">雙天線方案比較：裝機後同頻量測</title><desc id="desc">甲乙丙的匹配、S21隔離、兩端總效率表；本題要求匹配≤−10 dB、S21≤−15 dB、各效率≥60%。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277b91"/></marker></defs><rect width="1100" height="720" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#18364a" text-anchor="start">雙天線方案比較：裝機後同頻量測</text><rect x="175.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="290.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">Port 1 天線</text><path d="M405.0,165 L427.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="435.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="550.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">裝機隔離 / 輻射</text><path d="M665.0,165 L687.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="695.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="810.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">Port 2 天線</text><rect x="40" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="55" y="328" font-size="21" fill="#18364a" text-anchor="start">方案</text><rect x="295.0" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="310.0" y="328" font-size="21" fill="#18364a" text-anchor="start">S11 / S22</text><rect x="550.0" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="565.0" y="328" font-size="21" fill="#18364a" text-anchor="start">S21</text><rect x="805.0" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="820.0" y="328" font-size="21" fill="#18364a" text-anchor="start">總效率</text><rect x="40" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="388" font-size="21" fill="#18364a" text-anchor="start">甲</text><rect x="295.0" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="388" font-size="21" fill="#18364a" text-anchor="start">−15 / −14 dB</text><rect x="550.0" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="388" font-size="21" fill="#18364a" text-anchor="start">−8 dB</text><rect x="805.0" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="820.0" y="388" font-size="21" fill="#18364a" text-anchor="start">72% / 70%</text><rect x="40" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="448" font-size="21" fill="#18364a" text-anchor="start">乙</text><rect x="295.0" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="448" font-size="21" fill="#18364a" text-anchor="start">−14 / −14 dB</text><rect x="550.0" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="448" font-size="21" fill="#18364a" text-anchor="start">−20 dB</text><rect x="805.0" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="820.0" y="448" font-size="21" fill="#18364a" text-anchor="start">68% / 66%</text><rect x="40" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="508" font-size="21" fill="#18364a" text-anchor="start">丙</text><rect x="295.0" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="508" font-size="21" fill="#18364a" text-anchor="start">−22 / −22 dB</text><rect x="550.0" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="508" font-size="21" fill="#18364a" text-anchor="start">−25 dB</text><rect x="805.0" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="820.0" y="508" font-size="21" fill="#18364a" text-anchor="start">25% / 24%</text><rect x="40" y="530" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="568" font-size="21" fill="#18364a" text-anchor="start">本題需求</text><rect x="295.0" y="530" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="568" font-size="21" fill="#18364a" text-anchor="start">各≤−10 dB</text><rect x="550.0" y="530" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="568" font-size="21" fill="#18364a" text-anchor="start">≤−15 dB</text><rect x="805.0" y="530" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="820.0" y="568" font-size="21" fill="#18364a" text-anchor="start">各≥60%</text><text x="40" y="690" font-size="19" fill="#556c79" text-anchor="start">原創練習數據；圖中尺寸、材料與允收條件均為本題設定。</text></g></svg>
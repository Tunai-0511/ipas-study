<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">DSC 第一次升溫：步階與峰面積</title><desc id="desc">DSC吸熱向上，I在80°C為基線階躍，II140°C放熱面積20J/g試樣，III250°C吸熱90；完全晶體參考140J/g聚合物，聚合物分率0.80。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277b91"/></marker></defs><rect width="1100" height="720" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#18364a" text-anchor="start">DSC 第一次升溫：步階與峰面積</text><line x1="90" y1="245" x2="1015" y2="245" stroke="#254f68" stroke-width="3"/><line x1="90" y1="245" x2="90" y2="105" stroke="#254f68" stroke-width="3"/><text x="90" y="96" font-size="20" fill="#18364a" text-anchor="start">熱流：吸熱向上</text><path d="M100 210 L270 210 L300 190 L400 190 Q480 285 550 190 L720 190 Q810 15 900 190 L1000 190" fill="none" stroke="#b55735" stroke-width="4"/><text x="290" y="265" font-size="20" fill="#18364a" text-anchor="middle">I：80 °C</text><text x="490" y="285" font-size="20" fill="#18364a" text-anchor="middle">II：140 °C</text><text x="810" y="265" font-size="20" fill="#18364a" text-anchor="middle">III：250 °C</text><rect x="40" y="325" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="55" y="363" font-size="21" fill="#18364a" text-anchor="start">量測 / 參考值</text><rect x="550.0" y="325" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="565.0" y="363" font-size="21" fill="#18364a" text-anchor="start">數值</text><rect x="40" y="385" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="423" font-size="21" fill="#18364a" text-anchor="start">I：基線階躍 / II：放熱峰面積</text><rect x="550.0" y="385" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="423" font-size="21" fill="#18364a" text-anchor="start">80 °C / 20 J/g試樣</text><rect x="40" y="445" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="483" font-size="21" fill="#18364a" text-anchor="start">III：吸熱峰面積</text><rect x="550.0" y="445" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="483" font-size="21" fill="#18364a" text-anchor="start">90 J/g試樣</text><rect x="40" y="505" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="543" font-size="21" fill="#18364a" text-anchor="start">完全結晶聚合物參考熔融焓</text><rect x="550.0" y="505" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="543" font-size="21" fill="#18364a" text-anchor="start">140 J/g聚合物</text><rect x="40" y="565" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="603" font-size="21" fill="#18364a" text-anchor="start">試樣聚合物質量分率</text><rect x="550.0" y="565" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="603" font-size="21" fill="#18364a" text-anchor="start">0.80；其餘填料在此區間無相變</text><text x="40" y="690" font-size="19" fill="#556c79" text-anchor="start">原創練習數據；圖中尺寸、材料與允收條件均為本題設定。</text></g></svg>
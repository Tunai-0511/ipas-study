<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">外殼與人體負載的整機量測</title><desc id="desc">裸板、塑膠殼、握持、重調握持四組接受功率均100 mW，輻射80、65、25、26 mW；前三S11均−15，後者−20 dB。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277b91"/></marker></defs><rect width="1100" height="720" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#18364a" text-anchor="start">外殼與人體負載的整機量測</text><rect x="40" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="55" y="328" font-size="21" fill="#18364a" text-anchor="start">條件</text><rect x="295.0" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="310.0" y="328" font-size="21" fill="#18364a" text-anchor="start">S11</text><rect x="550.0" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="565.0" y="328" font-size="21" fill="#18364a" text-anchor="start">接受功率</text><rect x="805.0" y="290" width="255.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="820.0" y="328" font-size="21" fill="#18364a" text-anchor="start">輻射功率</text><rect x="40" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="388" font-size="21" fill="#18364a" text-anchor="start">裸板</text><rect x="295.0" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="388" font-size="21" fill="#18364a" text-anchor="start">−15 dB</text><rect x="550.0" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="388" font-size="21" fill="#18364a" text-anchor="start">100 mW</text><rect x="805.0" y="350" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="820.0" y="388" font-size="21" fill="#18364a" text-anchor="start">80 mW</text><rect x="40" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="448" font-size="21" fill="#18364a" text-anchor="start">塑膠殼</text><rect x="295.0" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="448" font-size="21" fill="#18364a" text-anchor="start">−15 dB</text><rect x="550.0" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="448" font-size="21" fill="#18364a" text-anchor="start">100 mW</text><rect x="805.0" y="410" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="820.0" y="448" font-size="21" fill="#18364a" text-anchor="start">65 mW</text><rect x="40" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="508" font-size="21" fill="#18364a" text-anchor="start">握持</text><rect x="295.0" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="508" font-size="21" fill="#18364a" text-anchor="start">−15 dB</text><rect x="550.0" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="508" font-size="21" fill="#18364a" text-anchor="start">100 mW</text><rect x="805.0" y="470" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="820.0" y="508" font-size="21" fill="#18364a" text-anchor="start">25 mW</text><rect x="40" y="530" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="568" font-size="21" fill="#18364a" text-anchor="start">重調匹配後握持</text><rect x="295.0" y="530" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="310.0" y="568" font-size="21" fill="#18364a" text-anchor="start">−20 dB</text><rect x="550.0" y="530" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="568" font-size="21" fill="#18364a" text-anchor="start">100 mW</text><rect x="805.0" y="530" width="255.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="820.0" y="568" font-size="21" fill="#18364a" text-anchor="start">26 mW</text><rect x="175.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="290.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">匹配網路</text><path d="M405.0,165 L427.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="435.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="550.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">天線 + 外殼</text><path d="M665.0,165 L687.0,165" fill="none" stroke="#277b91" stroke-width="3" marker-end="url(#arrow)"/><rect x="695.0" y="130" width="230" height="70" rx="7" fill="#e6f1f7" stroke="#254f68" stroke-width="2"/><text x="810.0" y="173.0" font-size="23" fill="#18364a" text-anchor="middle">握持負載</text><text x="550" y="238" font-size="22" fill="#18364a" text-anchor="middle">四組的接受功率已調整為相同，方便比較輻射損耗</text><text x="40" y="690" font-size="19" fill="#556c79" text-anchor="start">原創練習數據；圖中尺寸、材料與允收條件均為本題設定。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">單極天線長度與諧振掃描</title><desc id="desc">S11 掃描在2.20、2.40、2.60 GHz為−6、−18、−5 dB；裝殼後諧振2.28 GHz，理想四分之一波長模型。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277b91"/></marker></defs><rect width="1100" height="720" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Arial, sans-serif"><text x="40" y="55" font-size="30" fill="#18364a" text-anchor="start">單極天線長度與諧振掃描</text><line x1="85" y1="245" x2="1000" y2="245" stroke="#254f68" stroke-width="3"/><line x1="85" y1="245" x2="85" y2="110" stroke="#254f68" stroke-width="3"/><text x="65" y="100" font-size="19" fill="#18364a" text-anchor="start">S11 / dB</text><polyline points="110.0,137.30769230769232 535.0,225.0 960.0,130.0" fill="none" stroke="#b55735" stroke-width="4"/><circle cx="110.0" cy="137.30769230769232" r="6" fill="#b55735"/><text x="110.0" y="125.30769230769232" font-size="20" fill="#18364a" text-anchor="middle">-6</text><text x="110.0" y="276" font-size="19" fill="#18364a" text-anchor="middle">2.20 GHz</text><circle cx="535.0" cy="225.0" r="6" fill="#b55735"/><text x="535.0" y="213.0" font-size="20" fill="#18364a" text-anchor="middle">-18</text><text x="535.0" y="276" font-size="19" fill="#18364a" text-anchor="middle">2.40 GHz</text><circle cx="960.0" cy="130.0" r="6" fill="#b55735"/><text x="960.0" y="118.0" font-size="20" fill="#18364a" text-anchor="middle">-5</text><text x="960.0" y="276" font-size="19" fill="#18364a" text-anchor="middle">2.60 GHz</text><rect x="40" y="290" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="55" y="328" font-size="21" fill="#18364a" text-anchor="start">設計條件</text><rect x="550.0" y="290" width="510.0" height="60" fill="#e3edf3" stroke="#bbceda"/><text x="565.0" y="328" font-size="21" fill="#18364a" text-anchor="start">設定</text><rect x="40" y="350" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="388" font-size="21" fill="#18364a" text-anchor="start">目標頻率</text><rect x="550.0" y="350" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="388" font-size="21" fill="#18364a" text-anchor="start">2.40 GHz</text><rect x="40" y="410" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="448" font-size="21" fill="#18364a" text-anchor="start">近似傳播速度 c</text><rect x="550.0" y="410" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="448" font-size="21" fill="#18364a" text-anchor="start">3.00 × 10⁸ m/s</text><rect x="40" y="470" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="508" font-size="21" fill="#18364a" text-anchor="start">初估模型</text><rect x="550.0" y="470" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="508" font-size="21" fill="#18364a" text-anchor="start">理想四分之一波長單極</text><rect x="40" y="530" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="55" y="568" font-size="21" fill="#18364a" text-anchor="start">外殼裝上後諧振頻率</text><rect x="550.0" y="530" width="510.0" height="60" fill="#ffffff" stroke="#bbceda"/><text x="565.0" y="568" font-size="21" fill="#18364a" text-anchor="start">由 2.40 降至 2.28 GHz</text><text x="40" y="690" font-size="19" fill="#556c79" text-anchor="start">原創練習數據；圖中尺寸、材料與允收條件均為本題設定。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="752" viewBox="0 0 800 752" role="img" aria-labelledby="title desc"><title id="title">ICC 色彩轉換路徑</title><desc id="desc">ICC 色彩轉換路徑。欄位依序為：階段、資料。來源：RGB 數值＋來源 ICC；連接：PCS：CIEXYZ 或 CIELAB；目的：目的 ICC＋印表裝置數值。此為 ICC.1 架構；PCS 採 D50 參考。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">色彩管理｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">ICC 色彩轉換路徑</text><rect x="30" y="149" width="740" height="131" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="171" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="201" font-size="25" fill="#ffffff" font-weight="700">1</text><text x="106" y="189" font-size="27" fill="#156b8c" font-weight="700">來源</text><text x="106" y="234" font-size="30" fill="#142b40" font-weight="400">RGB 數值＋來源 ICC</text><path d="M400 285 V303" stroke="#156b8c" stroke-width="5"/><polygon points="386,300 414,300 400,318" fill="#156b8c"/><rect x="30" y="326" width="740" height="131" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="348" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="378" font-size="25" fill="#ffffff" font-weight="700">2</text><text x="106" y="366" font-size="27" fill="#156b8c" font-weight="700">連接</text><text x="106" y="411" font-size="30" fill="#142b40" font-weight="400">PCS：CIEXYZ 或 CIELAB</text><path d="M400 462 V480" stroke="#156b8c" stroke-width="5"/><polygon points="386,477 414,477 400,495" fill="#156b8c"/><rect x="30" y="503" width="740" height="131" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="525" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="555" font-size="25" fill="#ffffff" font-weight="700">3</text><text x="106" y="543" font-size="27" fill="#156b8c" font-weight="700">目的</text><text x="106" y="588" font-size="30" fill="#142b40" font-weight="400">目的 ICC＋印表裝置數值</text><rect x="30" y="658" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="692" font-size="26" fill="#604a1d" font-weight="400">此為 ICC.1 架構；PCS 採 D50 參考。</text></g></svg>

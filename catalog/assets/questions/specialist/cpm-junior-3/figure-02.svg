<svg xmlns="http://www.w3.org/2000/svg" width="800" height="585" viewBox="0 0 800 585" role="img" aria-labelledby="title desc"><title id="title">量測色樣：CIELAB 座標</title><desc id="desc">量測色樣：CIELAB 座標。欄位依序為：樣品、L*、a*、b*。標準：50：10：20；樣品甲：53：14：20；樣品乙：50：10：26。本題指定使用 ΔE*ab＝√(ΔL*²＋Δa*²＋Δb*²)，不是 ΔE00。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">色彩管理｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">量測色樣：CIELAB 座標</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">樣品</text><text x="245" y="190" font-size="28" fill="#ffffff" font-weight="700">L*</text><text x="425" y="190" font-size="28" fill="#ffffff" font-weight="700">a*</text><text x="605" y="190" font-size="28" fill="#ffffff" font-weight="700">b*</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">標準</text><text x="245" y="260" font-size="30" fill="#142b40" font-weight="400">50</text><text x="425" y="260" font-size="30" fill="#142b40" font-weight="400">10</text><text x="605" y="260" font-size="30" fill="#142b40" font-weight="400">20</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">樣品甲</text><text x="245" y="330" font-size="30" fill="#142b40" font-weight="400">53</text><text x="425" y="330" font-size="30" fill="#142b40" font-weight="400">14</text><text x="605" y="330" font-size="30" fill="#142b40" font-weight="400">20</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740
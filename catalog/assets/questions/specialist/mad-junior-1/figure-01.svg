<svg xmlns="http://www.w3.org/2000/svg" width="800" height="549" viewBox="0 0 800 549" role="img" aria-labelledby="title desc"><title id="title">裝置與畫面資源</title><desc id="desc">裝置與畫面資源。欄位依序為：項目、數值／用途。甲螢幕密度：2 px / dp；元件寬度：48 dp；文字單位：sp，支援使用者文字縮放。本題給定換算比例；不把實體像素直接當作一致的操作大小。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">行動裝置概論｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">裝置與畫面資源</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">項目</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">數值／用途</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">甲螢幕密度</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">2 px / dp</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">元件寬度</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">48 dp</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">文字單位</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">sp，支援使用者文字縮放</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="455" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="489" font-size="26" fill="#604a1d" font-weight="400">本題給定換算比例；不把實體像素直接當作一致的操作大小。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="549" viewBox="0 0 800 549" role="img" aria-labelledby="title desc"><title id="title">App資料保存層</title><desc id="desc">App資料保存層。欄位依序為：層次、特性。畫面記憶體：程序結束後可能消失；本機持久儲存：可跨程序重新啟動保存；伺服器：需處理網路與同步。重要草稿需明確選擇持久化策略。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">行動裝置概論｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">App資料保存層</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">層次</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">特性</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">畫面記憶體</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">程序結束後可能消失</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">本機持久儲存</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">可跨程序重新啟動保存</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">伺服器</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">需處理網路與同步</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="455" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="489" font-size="26" fill="#604a1d" font-weight="400">重要草稿需明確選擇持久化策略。</text></g></svg>

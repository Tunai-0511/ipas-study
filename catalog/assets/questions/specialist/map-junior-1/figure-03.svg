<svg xmlns="http://www.w3.org/2000/svg" width="800" height="549" viewBox="0 0 800 549" role="img" aria-labelledby="title desc"><title id="title">首版方案比較</title><desc id="desc">首版方案比較。欄位依序為：方案、核心任務／開發天數。甲：查看已存路線／4天；乙：社群頭像裝飾／8天；丙：離線路線快取／3天。首版期限7天；主要目標是網路不穩時也能查看已存路線。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">行動應用企劃概論｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">首版方案比較</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">方案</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">核心任務／開發天數</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">甲</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">查看已存路線／4天</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">乙</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">社群頭像裝飾／8天</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">丙</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">離線路線快取／3天</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="455" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="489" font-size="26" fill="#604a1d" font-weight="400">首版期限7天；主要目標是網路不穩時也能查看已存路線。</text></g></svg>

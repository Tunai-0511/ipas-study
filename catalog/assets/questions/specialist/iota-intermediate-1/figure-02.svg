<svg xmlns="http://www.w3.org/2000/svg" width="800" height="659" viewBox="0 0 800 659" role="img" aria-labelledby="title desc"><title id="title">收集容量規劃</title><desc id="desc">收集容量規劃。欄位依序為：變數、數值。裝置數：2,000台；每台上報間隔：10秒；每則應用資料大小：256 bytes；容量假設：不計協定標頭及壓縮；流量均勻。系統目標：處理速率必須長期高於平均輸入速率。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">物聯網整合應用與雲端平台設計實務｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">收集容量規劃</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">變數</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">數值</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">裝置數</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">2,000台</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">每台上報間隔</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">10秒</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="110" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">每則應用資料</text><text x="45" y="440" font-size="30" fill="#142b40" font-weight="400">大小</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">256 bytes</text><path d="M30 467 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="467" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="510" font-size="30" fill="#142b40" font-weight="400">容量假設</text><text x="270" y="510" font-size="30" fill="#142b40" font-weight="400">不計協定標頭及壓縮；流量均勻</text><path d="M30 537 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="565" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="599" font-size="26" fill="#604a1d" font-weight="400">系統目標：處理速率必須長期高於平均輸入速率。</text></g></svg>

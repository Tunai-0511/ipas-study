<svg xmlns="http://www.w3.org/2000/svg" width="800" height="655" viewBox="0 0 800 655" role="img" aria-labelledby="title desc"><title id="title">資料去重與事件時間</title><desc id="desc">資料去重與事件時間。欄位依序為：收到順序、message_id、event_time。1：dev7-101：10:00:01；2：dev7-102：10:00:03；3：dev7-101：10:00:01；4：dev7-100：09:59:59。相同 message_id 表同一筆事件；到達時間不保證等於發生時間。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">物聯網整合應用與雲端平台設計實務｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">資料去重與事件時間</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">收到順序</text><text x="245" y="190" font-size="28" fill="#ffffff" font-weight="700">message_id</text><text x="475" y="190" font-size="28" fill="#ffffff" font-weight="700">event_time</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">1</text><text x="245" y="260" font-size="30" fill="#142b40" font-weight="400">dev7-101</text><text x="475" y="260" font-size="30" fill="#142b40" font-weight="400">10:00:01</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">2</text><text x="245" y="330" font-size="30" fill="#142b40" font-weight="400">dev7-102</text><text x="475" y="330" font-size="30" fill="#142b40" font-weight="400">10:00:03</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">3</text><text x="245" y="400" font-size="30" fill="#142b40" font-weight="400">dev7-101</text><text x="475" y="400" font-size="30" fill="#142b40" font-weight="400">10:00:01</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="427" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="470" font-size="30" fill="#142b40" font-weight="400">4</text><text x="245" y="470" font-size="30" fill="#142b40" font-weight="400">dev7-100</text><text x="475" y="470" font-size="30" fill="#142b40" font-weight="400">09:59:59</text><path d="M30 497 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="525" width="740" height="104" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="559" font-size="26" fill="#604a1d" font-weight="400">相同 message_id 表同一筆事件；到達時間不保證等於發生</text><text x="46" y="595" font-size="26" fill="#604a1d" font-weight="400">時間。</text></g></svg>

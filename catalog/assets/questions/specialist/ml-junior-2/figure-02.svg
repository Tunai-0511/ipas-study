<svg xmlns="http://www.w3.org/2000/svg" width="800" height="619" viewBox="0 0 800 619" role="img" aria-labelledby="title desc"><title id="title">機率與分類門檻</title><desc id="desc">機率與分類門檻。欄位依序為：樣本／實際、預測正類機率。甲／正：0.80；乙／正：0.45；丙／負：0.40；丁／負：0.10。預測規則：機率大於或等於門檻為正。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">機器學習資料解析與建模｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">機率與分類門檻</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">樣本／實際</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">預測正類機率</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">甲／正</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">0.80</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">乙／正</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">0.45</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">丙／負</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">0.40</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="427" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="470" font-size="30" fill="#142b40" font-weight="400">丁／負</text><text x="270" y="470" font-size="30" fill="#142b40" font-weight="400">0.10</text><path d="M30 497 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="525" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="559" font-size="26" fill="#604a1d" font-weight="400">預測規則：機率大於或等於門檻為正。</text></g></svg>

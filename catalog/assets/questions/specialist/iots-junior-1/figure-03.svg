<svg xmlns="http://www.w3.org/2000/svg" width="800" height="659" viewBox="0 0 800 659" role="img" aria-labelledby="title desc"><title id="title">振動取樣設定</title><desc id="desc">振動取樣設定。欄位依序為：項目、數值。欲觀察最高頻率：200Hz；方案甲取樣率：300 samples/s；方案乙取樣率：1,000 samples/s；類比前端：取樣前需控制頻外訊號。以基頻低通取樣情境討論，不採帶通欠取樣。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">感測器原理與應用｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">振動取樣設定</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">項目</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">數值</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="110" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">欲觀察最高頻</text><text x="45" y="300" font-size="30" fill="#142b40" font-weight="400">率</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">200Hz</text><path d="M30 327 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="327" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="370" font-size="30" fill="#142b40" font-weight="400">方案甲取樣率</text><text x="270" y="370" font-size="30" fill="#142b40" font-weight="400">300 samples/s</text><path d="M30 397 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="397" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="440" font-size="30" fill="#142b40" font-weight="400">方案乙取樣率</text><text x="270" y="440" font-size="30" fill="#142b40" font-weight="400">1,000 samples/s</text><path d="M30 467 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="467" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="510" font-size="30" fill="#142b40" font-weight="400">類比前端</text><text x="270" y="510" font-size="30" fill="#142b40" font-weight="400">取樣前需控制頻外訊號</text><path d="M30 537 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="565" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="599" font-size="26" fill="#604a1d" font-weight="400">以基頻低通取樣情境討論，不採帶通欠取樣。</text></g></svg>

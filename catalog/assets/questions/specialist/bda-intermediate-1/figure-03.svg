<svg xmlns="http://www.w3.org/2000/svg" width="800" height="619" viewBox="0 0 800 619" role="img" aria-labelledby="title desc"><title id="title">訂閱取消預測時間線</title><desc id="desc">訂閱取消預測時間線。欄位依序為：資料階段、時間／可取得資訊。訓練：1～6月當時可觀測特徵；驗證：7月；最終測試：8月；禁用特徵：取消後才產生的退款狀態。目標是在取消之前預警。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">資料分析與資料科學｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">訂閱取消預測時間線</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">資料階段</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">時間／可取得資訊</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">訓練</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">1～6月當時可觀測特徵</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">驗證</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">7月</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">最終測試</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">8月</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="427" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="470" font-size="30" fill="#142b40" font-weight="400">禁用特徵</text><text x="270" y="470" font-size="30" fill="#142b40" font-weight="400">取消後才產生的退款狀態</text><path d="M30 497 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="525" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="559" font-size="26" fill="#604a1d" font-weight="400">目標是在取消之前預警。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="629" viewBox="0 0 800 629" role="img" aria-labelledby="title desc"><title id="title">碰撞與得分規則</title><desc id="desc">碰撞與得分規則。欄位依序為：物件／事件、規則。子彈命中敵人：敵人扣1生命；子彈回收；敵人生命由1降到0：只加分一次；同幀重複碰撞回呼：已失效物件不得再造成傷害。每個命中／死亡事件需有明確狀態，避免重複副作用。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">行動遊戲程式設計實作｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">碰撞與得分規則</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">物件／事件</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">規則</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">子彈命中敵人</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">敵人扣1生命；子彈回收</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="110" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">敵人生命由1</text><text x="45" y="370" font-size="30" fill="#142b40" font-weight="400">降到0</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">只加分一次</text><path d="M30 397 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="397" width="740" height="110" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="440" font-size="30" fill="#142b40" font-weight="400">同幀重複碰撞</text><text x="45" y="480" font-size="30" fill="#142b40" font-weight="400">回呼</text><text x="270" y="440" font-size="30" fill="#142b40" font-weight="400">已失效物件不得再造成傷害</text><path d="M30 507 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="535" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="569" font-size="26" fill="#604a1d" font-weight="400">每個命中／死亡事件需有明確狀態，避免重複副作用。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="549" viewBox="0 0 800 549" role="img" aria-labelledby="title desc"><title id="title">二維移動計算</title><desc id="desc">二維移動計算。欄位依序為：量、數值。初始位置：(1, 2)；速度：(3, −4) 單位／秒；本步時間：0.5秒。使用p_new=p_old+v×dt；本題不含加速度。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">行動遊戲程式設計實作｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">二維移動計算</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">量</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">數值</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">初始位置</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">(1, 2)</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">速度</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">(3, −4) 單位／秒</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">本步時間</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">0.5秒</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="455" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="489" font-size="26" fill="#604a1d" font-weight="400">使用p_new=p_old+v×dt；本題不含加速度。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="619" viewBox="0 0 800 619" role="img" aria-labelledby="title desc"><title id="title">品牌權利金節省法：教學資料</title><desc id="desc">品牌權利金節省法：教學資料。欄位依序為：變數、數值。年度相關收入：2,000萬元；可比權利金率：3%；有效稅率：20%；現金流時點：一年後；折現率20%。假設權利金可抵稅、無其他成本、無稅盾增額。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">無形資產評價方法之整合應用｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">品牌權利金節省法：教學資料</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">變數</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">數值</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">年度相關收入</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">2,000萬元</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">可比權利金率</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">3%</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">有效稅率</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">20%</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="427" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="470" font-size="30" fill="#142b40" font-weight="400">現金流時點</text><text x="270" y="470" font-size="30" fill="#142b40" font-weight="400">一年後；折現率20%</text><path d="M30 497 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="525" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="559" font-size="26" fill="#604a1d" font-weight="400">假設權利金可抵稅、無其他成本、無稅盾增額。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="659" viewBox="0 0 800 659" role="img" aria-labelledby="title desc"><title id="title">技術授權：單年簡化模型</title><desc id="desc">技術授權：單年簡化模型。欄位依序為：假設、數值。年末授權淨現金流：110萬元；剩餘年限：1年，無殘值；折現率：10%；市場可比交易：用途、地區及期限尚未調整。金額為自編假設；不含稅盾或額外營運資金。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">無形資產評價方法之整合應用｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">技術授權：單年簡化模型</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">假設</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">數值</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="110" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">年末授權淨現</text><text x="45" y="300" font-size="30" fill="#142b40" font-weight="400">金流</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">110萬元</text><path d="M30 327 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="327" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="370" font-size="30" fill="#142b40" font-weight="400">剩餘年限</text><text x="270" y="370" font-size="30" fill="#142b40" font-weight="400">1年，無殘值</text><path d="M30 397 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="397" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="440" font-size="30" fill="#142b40" font-weight="400">折現率</text><text x="270" y="440" font-size="30" fill="#142b40" font-weight="400">10%</text><path d="M30 467 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="467" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="510" font-size="30" fill="#142b40" font-weight="400">市場可比交易</text><text x="270" y="510" font-size="30" fill="#142b40" font-weight="400">用途、地區及期限尚未調整</text><path d="M30 537 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="565" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="599" font-size="26" fill="#604a1d" font-weight="400">金額為自編假設；不含稅盾或額外營運資金。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="669" viewBox="0 0 800 669" role="img" aria-labelledby="title desc"><title id="title">方法與證據矩陣</title><desc id="desc">方法與證據矩陣。欄位依序為：資產、可用證據、需注意。新軟體模組：重置工時、替代成本：功能性與經濟性貶值；品牌：可比授權合約、收入預測：權利範圍及收入基礎；客戶關係：客戶流失、貢獻利潤：其他貢獻資產報酬。方法選用取決於評價目的、價值基礎及證據品質。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">無形資產評價方法之整合應用｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">方法與證據矩陣</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">資產</text><text x="245" y="190" font-size="28" fill="#ffffff" font-weight="700">可用證據</text><text x="475" y="190" font-size="28" fill="#ffffff" font-weight="700">需注意</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="110" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">新軟體模組</text><text x="245" y="260" font-size="30" fill="#142b40" font-weight="400">重置工時、替</text><text x="245" y="300" font-size="30" fill="#142b40" font-weight="400">代成本</text><text x="475" y="260" font-size="30" fill="#142b40" font-weight="400">功能性與經濟性貶值</text><path d="M30 327 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="327" width="740" height="110" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="370" font-size="30" fill="#142b40" font-weight="400">品牌</text><text x="245" y="370" font-size="30" fill="#142b40" font-weight="400">可比授權合約</text><text x="245" y="410" font-size="30" fill="#142b40" font-weight="400">、收入預測</text><text x="475" y="370" font-size="30" fill="#142b40" font-weight="400">權利範圍及收入基礎</text><path d="M30 437 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="437" width="740" height="110" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="480" font-size="30" fill="#142b40" font-weight="400">客戶關係</text><text x="245" y="480" font-size="30" fill="#142b40" font-weight="400">客戶流失、貢</text><text x="245" y="520" font-size="30" fill="#142b40" font-weight="400">獻利潤</text><text x="475" y="480" font-size="30" fill="#142b40" font-weight="400">其他貢獻資產報酬</text><path d="M30 547 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="575" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="609" font-size="26" fill="#604a1d" font-weight="400">方法選用取決於評價目的、價值基礎及證據品質。</text></g></svg>

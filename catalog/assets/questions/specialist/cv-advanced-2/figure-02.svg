<svg xmlns="http://www.w3.org/2000/svg" width="800" height="735" viewBox="0 0 800 735" role="img" aria-labelledby="title desc"><title id="title">客戶群留存與貢獻</title><desc id="desc">客戶群留存與貢獻。欄位依序為：變數、假設。期初客戶：1,000戶；每年流失率：20%；每戶年末淨貢獻：1,000元；其他貢獻資產費用：每年末10萬元。第一年先流失再計收入；不增新客；不考慮稅與折現以外調整。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">無形資產評價實作｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">客戶群留存與貢獻</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">變數</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">假設</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">期初客戶</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">1,000戶</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">每年流失率</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">20%</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="110" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">每戶年末淨貢</text><text x="45" y="440" font-size="30" fill="#142b40" font-weight="400">獻</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">1,000元</text><path d="M30 467 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="467" width="740" height="110" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="510" font-size="30" fill="#142b40" font-weight="400">其他貢獻資產</text><text x="45" y="550" font-size="30" fill="#142b40" font-weight="400">費用</text><text x="270" y="510" font-size="30" fill="#142b40" font-weight="400">每年末10萬元</text><path d="M30 577 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="605" width="740" height="104" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="639" font-size="26" fill="#604a1d" font-weight="400">第一年先流失再計收入；不增新客；不考慮稅與折現以外調整</text><text x="46" y="675" font-size="26" fill="#604a1d" font-weight="400">。</text></g></svg>

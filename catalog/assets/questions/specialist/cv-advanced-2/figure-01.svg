<svg xmlns="http://www.w3.org/2000/svg" width="800" height="549" viewBox="0 0 800 549" role="img" aria-labelledby="title desc"><title id="title">技術現金流工作底稿</title><desc id="desc">技術現金流工作底稿。欄位依序為：年末、稅後現金流、折現因子。第1年：120萬元：1÷1.10；第2年：121萬元：1÷1.10²；期末：殘值0：已包含全部必要支出。此表為指定教學模型；金額非真實企業資料。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">無形資產評價實作｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">技術現金流工作底稿</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">年末</text><text x="245" y="190" font-size="28" fill="#ffffff" font-weight="700">稅後現金流</text><text x="475" y="190" font-size="28" fill="#ffffff" font-weight="700">折現因子</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">第1年</text><text x="245" y="260" font-size="30" fill="#142b40" font-weight="400">120萬元</text><text x="475" y="260" font-size="30" fill="#142b40" font-weight="400">1÷1.10</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">第2年</text><text x="245" y="330" font-size="30" fill="#142b40" font-weight="400">121萬元</text><text x="475" y="330" font-size="30" fill="#142b40" font-weight="400">1÷1.10²</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">期末</text><text x="245" y="400" font-size="30" fill="#142b40" font-weight="400">殘值0</text><text x="475" y="400"
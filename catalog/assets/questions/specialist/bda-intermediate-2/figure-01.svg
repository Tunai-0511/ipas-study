<svg xmlns="http://www.w3.org/2000/svg" width="800" height="619" viewBox="0 0 800 619" role="img" aria-labelledby="title desc"><title id="title">分散式聚合的分區負載</title><desc id="desc">分散式聚合的分區負載。欄位依序為：分區、輸入筆數。P0：900萬；P1：30萬；P2：30萬；P3：40萬。各分區平均每筆運算量相近；P0主要來自同一熱門鍵。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">巨量資料分析實作｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">分散式聚合的分區負載</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">分區</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">輸入筆數</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">P0</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">900萬</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">P1</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">30萬</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">P2</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">30萬</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="427" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="470" font-size="30" fill="#142b40" font-weight="400">P3</text><text x="270" y="470" font-size="30" fill="#142b40" font-weight="400">40萬</text><path d="M30 497 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="525" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="559" font-size="26" fill="#604a1d" font-weight="400">各分區平均每筆運算量相近；P0主要來自同一熱門鍵。</text></g></svg>

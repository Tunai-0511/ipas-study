<svg xmlns="http://www.w3.org/2000/svg" width="800" height="929" viewBox="0 0 800 929" role="img" aria-labelledby="title desc"><title id="title">每日匯入管線</title><desc id="desc">每日匯入管線。欄位依序為：階段、規則。來源：batch_id=20261001，每列有event_id；暫存：驗證schema與唯一event_id；目標：依event_id更新或插入；重試：允許相同batch_id再次執行。設計需確保重試不重複累加。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">巨量資料分析實作｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">每日匯入管線</text><rect x="30" y="149" width="740" height="131" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="171" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="201" font-size="25" fill="#ffffff" font-weight="700">1</text><text x="106" y="189" font-size="27" fill="#156b8c" font-weight="700">來源</text><text x="106" y="234" font-size="30" fill="#142b40" font-weight="400">batch_id=20261001，每列有event_id</text><path d="M400 285 V303" stroke="#156b8c" stroke-width="5"/><polygon points="386,300 414,300 400,318" fill="#156b8c"/><rect x="30" y="326" width="740" height="131" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="348" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="378" font-size="25" fill="#ffffff" font-weight="700">2</text><text x="106" y="366" font-size="27" fill="#156b8c" font-weight="700">暫存</text><text x="106" y="411" font-size="30" fill="#142b40" font-weight="400">驗證schema與唯一event_id</text><path d="M400 462 V480" stroke="#156b8c" stroke-width="5"/><polygon points="386,477 414,477 400,495" fill="#156b8c"/><rect x="30" y="503" width="740" height="131" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="525" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="555" font-size="25" fill="#ffffff" font-weight="700">3</text><text x="106" y="543" font-size="27" fill="#156b8c" font-weight="700">目標</text><text x="106" y="588" font-size="30" fill="#142b40" font-weight="400">依event_id更新或插入</text><path d="M400 639 V657" stroke="#156b8c" stroke-width="5"/><polygon points="386,654 414,654 400,672" fill="#156b8c"/><rect x="30" y="680" width="740" height="131" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="702" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="732" font-size="25" fill="#ffffff" font-weight="700">4</text><text x="106" y="720" font-size="27" fill="#156b8c" font-weight="700">重試</text><text x="106" y="765" font-size="30" fill="#142b40" font-weight="400">允許相同batch_id再次執行</text><rect x="30" y="835" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="869" font-size="26" fill="#604a1d" font-weight="400">設計需確保重試不重複累加。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="549" viewBox="0 0 800 549" role="img" aria-labelledby="title desc"><title id="title">交易表與商品維度</title><desc id="desc">交易表與商品維度。欄位依序為：資料集、大小／鍵。交易表：500GB／product_id可重複；商品維度：5MB／product_id唯一；操作：以product_id連接後按類別彙總。可評估廣播小表；仍需確認執行器記憶體與執行計畫。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">巨量資料分析實作｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">交易表與商品維度</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">資料集</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">大小／鍵</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">交易表</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">500GB／product_id可重複</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">商品維度</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">5MB／product_id唯一</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">操作</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">以product_id連接後按類別彙總</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="455" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="489" font-size="26" fill="#604a1d" font-weight="400">可評估廣播小表；仍需確認執行器記憶體與執行計畫。</text></g></svg>

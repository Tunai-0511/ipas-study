<svg xmlns="http://www.w3.org/2000/svg" width="800" height="589" viewBox="0 0 800 589" role="img" aria-labelledby="title desc"><title id="title">Room資料表升級案例</title><desc id="desc">Room資料表升級案例。欄位依序為：版本、資料結構。v1：Task(id, title)；v2：Task(id, title, done)；既有資料要求：原id與title保留；done預設false。此題為實作準備，需撰寫並驗證遷移；不是官方實作題。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">行動裝置程式設計實作-Android開發實務｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">Room資料表升級案例</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">版本</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">資料結構</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">v1</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">Task(id, title)</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">v2</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">Task(id, title, done)</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="110" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">既有資料要求</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">原id與title保留；done預設</text><text x="270" y="440" font-size="30" fill="#142b40" font-weight="400">false</text><path d="M30 467 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="495" width="740" height="68"
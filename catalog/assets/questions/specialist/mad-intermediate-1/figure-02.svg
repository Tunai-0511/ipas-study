<svg xmlns="http://www.w3.org/2000/svg" width="800" height="589" viewBox="0 0 800 589" role="img" aria-labelledby="title desc"><title id="title">兩裝置編輯同一筆記事</title><desc id="desc">兩裝置編輯同一筆記事。欄位依序為：事件、版本。初始：伺服器version=5；裝置A：以baseVersion=5送出修改，成功成為6；裝置B：仍以baseVersion=5送出另一修改。API約定：baseVersion必須等於目前版本才可更新。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">行動裝置應用開發實務｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">兩裝置編輯同一筆記事</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">事件</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">版本</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">初始</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">伺服器version=5</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="110" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">裝置A</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">以baseVersion=5送出修改，成功</text><text x="270" y="370" font-size="30" fill="#142b40" font-weight="400">成為6</text><path d="M30 397 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="397" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="440" font-size="30" fill="#142b40" font-weight="400">裝置B</text><text x="270" y="440" font-size="30" fill="#142b40" font-weight="400">仍以baseVersion=5送出另一修改</text><path d="M30 467 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="495" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="529" font-size="26" fill="#604a1d" font-weight="400">API約定：baseVersion必須等於目前版本才可更新。</text></g></svg>

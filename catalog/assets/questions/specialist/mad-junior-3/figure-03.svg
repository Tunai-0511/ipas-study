<svg xmlns="http://www.w3.org/2000/svg" width="800" height="589" viewBox="0 0 800 589" role="img" aria-labelledby="title desc"><title id="title">iOS資料用途與保存</title><desc id="desc">iOS資料用途與保存。欄位依序為：資料、需求。畫面計數：變更時更新UI；登入權杖：避免明文散落一般設定或紀錄；大型可重抓圖片：可重新下載的快取。保存策略依敏感度與可重建性選擇。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">行動裝置程式開發-iOS程式設計｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">iOS資料用途與保存</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">資料</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">需求</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">畫面計數</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">變更時更新UI</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">登入權杖</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">避免明文散落一般設定或紀錄</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="110" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">大型可重抓圖</text><text x="45" y="440" font-size="30" fill="#142b40" font-weight="400">片</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">可重新下載的快取</text><path d="M30 467 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="495" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="529" font-size="26" fill="#604a1d" font-weight="400">保存策略依敏感度與可重建性選擇。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="655" viewBox="0 0 800 655" role="img" aria-labelledby="title desc"><title id="title">無形資產盤點案例</title><desc id="desc">無形資產盤點案例。欄位依序為：項目、內容。甲：節能控制的抽象構想；乙：自行完成的操作手冊文字；丙：用於產品的原創外觀造型；丁：未公開且有競爭價值的製程參數。假設文字及造型非抄襲；是否取得具體權利仍須按各制度要件判斷。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">智慧財產權法｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">無形資產盤點案例</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">項目</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">內容</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">甲</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">節能控制的抽象構想</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">乙</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">自行完成的操作手冊文字</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">丙</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">用於產品的原創外觀造型</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="427" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="470" font-size="30" fill="#142b40" font-weight="400">丁</text><text x="270" y="470" font-size="30" fill="#142b40" font-weight="400">未公開且有競爭價值的製程參數</text><path d="M30 497 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="525" width="740" height="104" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="559" font-size="26" fill="#604a1d" font-weight="400">假設文字及造型非抄襲；是否取得具體權利仍須按各制度要件</text><text x="46" y="595" font-size="26" fill="#604a1d" font-weight="400">判斷。</text></g></svg>

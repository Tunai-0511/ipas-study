<svg xmlns="http://www.w3.org/2000/svg" width="800" height="619" viewBox="0 0 800 619" role="img" aria-labelledby="title desc"><title id="title">營業秘密管理事實</title><desc id="desc">營業秘密管理事實。欄位依序為：項目、現況。資訊內容：競爭者未知的有效配方；價值：可降低試製成本；存取：任何人可用公開網址下載；契約：員工簽了保密約定。以臺灣營業秘密法三要件的官方說明作概念判讀。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">智慧財產權法｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">營業秘密管理事實</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">項目</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">現況</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">資訊內容</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">競爭者未知的有效配方</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">價值</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">可降低試製成本</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">存取</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">任何人可用公開網址下載</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="427" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="470" font-size="30" fill="#142b40" font-weight="400">契約</text><text x="270" y="470" font-size="30" fill="#142b40" font-weight="400">員工簽了保密約定</text><path d="M30 497 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="525" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="559" font-size="26" fill="#604a1d" font-weight="400">以臺灣營業秘密法三要件的官方說明作概念判讀。</text></g></svg>

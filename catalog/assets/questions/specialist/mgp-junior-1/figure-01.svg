<svg xmlns="http://www.w3.org/2000/svg" width="800" height="549" viewBox="0 0 800 549" role="img" aria-labelledby="title desc"><title id="title">兩裝置的更新頻率</title><desc id="desc">兩裝置的更新頻率。欄位依序為：裝置、幀率／每幀固定移動。甲：30fps／0.1單位；乙：60fps／0.1單位；需求：角色速度應為3單位／秒。比較固定每幀距離與依deltaTime移動。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">行動遊戲開發概論｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">兩裝置的更新頻率</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">裝置</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">幀率／每幀固定移動</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">甲</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">30fps／0.1單位</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">乙</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">60fps／0.1單位</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">需求</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">角色速度應為3單位／秒</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="455" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="489" font-size="26" fill="#604a1d" font-weight="400">比較固定每幀距離與依deltaTime移動。</text></g></svg>

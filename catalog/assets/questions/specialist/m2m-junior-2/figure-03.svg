<svg xmlns="http://www.w3.org/2000/svg" width="800" height="619" viewBox="0 0 800 619" role="img" aria-labelledby="title desc"><title id="title">事件觀測時間線</title><desc id="desc">事件觀測時間線。欄位依序為：時間、觀察。09:00：陌生來源連入維護入口；09:03：管理員設定遭修改；09:05：設備告警增加；09:06：控制系統仍可由現場安全操作。處置需由授權團隊兼顧人員安全、證據與生產程序。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">工控資訊安全技術｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">事件觀測時間線</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">時間</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">觀察</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">09:00</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">陌生來源連入維護入口</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">09:03</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">管理員設定遭修改</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">09:05</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">設備告警增加</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="427" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="470" font-size="30" fill="#142b40" font-weight="400">09:06</text><text x="270" y="470" font-size="30" fill="#142b40" font-weight="400">控制系統仍可由現場安全操作</text><path d="M30 497 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="525" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="559" font-size="26" fill="#604a1d" font-weight="400">處置需由授權團隊兼顧人員安全、證據與生產程序。</text></g></svg>

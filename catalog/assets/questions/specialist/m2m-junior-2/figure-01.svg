<svg xmlns="http://www.w3.org/2000/svg" width="800" height="669" viewBox="0 0 800 669" role="img" aria-labelledby="title desc"><title id="title">維護帳戶盤點</title><desc id="desc">維護帳戶盤點。欄位依序為：帳戶、存取方式、問題。vendor：所有廠商共用密碼：無法歸責；operator7：個人帳戶＋最小權限：僅可監看；engineer2：遠端登入無MFA：憑證遭竊風險。遠端維護須經授權入口並保留操作紀錄。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">工控資訊安全技術｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">維護帳戶盤點</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">帳戶</text><text x="245" y="190" font-size="28" fill="#ffffff" font-weight="700">存取方式</text><text x="475" y="190" font-size="28" fill="#ffffff" font-weight="700">問題</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="110" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">vendor</text><text x="245" y="260" font-size="30" fill="#142b40" font-weight="400">所有廠商共用</text><text x="245" y="300" font-size="30" fill="#142b40" font-weight="400">密碼</text><text x="475" y="260" font-size="30" fill="#142b40" font-weight="400">無法歸責</text><path d="M30 327 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="327" width="740" height="110" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="370" font-size="30" fill="#142b40" font-weight="400">operator7</text><text x="245" y="370" font-size="30" fill="#142b40" font-weight="400">個人帳戶＋最</text><text x="245" y="410" font-size="30" fill="#142b40" font-weight="400">小權限</text><text x="475" y="370" font-size="30" fill="#142b40" font-weight="400">僅可監看</text><path d="M30 437 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="437" width="740" height="110" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="480" font-size="30" fill="#142b40" font-weight="400">engineer2</text><text x="245" y="480" font-size="30" fill="#142b40" font-weight="400">遠端登入無</text><text x="245" y="520" font-size="30" fill="#142b40" font-weight="400">MFA</text><text x="475" y="480" font-size="30" fill="#142b40" font-weight="400">憑證遭竊風險</text><path d="M30 547 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="575" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="609" font-size="26" fill="#604a1d" font-weight="400">遠端維護須經授權入口並保留操作紀錄。</text></g></svg>

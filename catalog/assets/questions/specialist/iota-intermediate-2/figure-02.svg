<svg xmlns="http://www.w3.org/2000/svg" width="800" height="619" viewBox="0 0 800 619" role="img" aria-labelledby="title desc"><title id="title">溫度類比轉換</title><desc id="desc">溫度類比轉換。欄位依序為：量、假設。溫度T：0～100°C；感測器輸出：V＝0.5＋0.02T（V）；理想ADC：12-bit；Vref＝3.3V；數位碼：floor(V÷3.3×4096)，上限4095。輸入位於量測範圍內；不另計元件誤差。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">物聯網應用實作｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">溫度類比轉換</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">量</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">假設</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">溫度T</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">0～100°C</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">感測器輸出</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">V＝0.5＋0.02T（V）</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">理想ADC</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">12-bit；Vref＝3.3V</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="427" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="470" font-size="30" fill="#142b40" font-weight="400">數位碼</text><text x="270" y="470" font-size="30" fill="#142b40" font-weight="400">floor(V÷3.3×4096)，上限4095</text><path d="M30 497 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="525" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="559" font-size="26" fill="#604a1d" font-weight="400">輸入位於量測範圍內；不另計元件誤差。</text></g></svg>

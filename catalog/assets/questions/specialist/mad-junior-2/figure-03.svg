<svg xmlns="http://www.w3.org/2000/svg" width="800" height="792" viewBox="0 0 800 792" role="img" aria-labelledby="title desc"><title id="title">Kotlin清單程式</title><desc id="desc">Kotlin清單程式。欄位依序為：位置、程式。資料：val nums = listOf(1, 2, 3, 4)；轉換：val out = nums.filter { it % 2 == 0 }；結果：val sum = out.sum()。filter保留符合條件的元素，並不就地刪除原清單。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">行動裝置程式開發-Android程式設計｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">Kotlin清單程式</text><rect x="30" y="149" width="740" height="131" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="171" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="201" font-size="25" fill="#ffffff" font-weight="700">1</text><text x="106" y="189" font-size="27" fill="#156b8c" font-weight="700">資料</text><text x="106" y="234" font-size="30" fill="#142b40" font-weight="400">val nums = listOf(1, 2, 3, 4)</text><path d="M400 285 V303" stroke="#156b8c" stroke-width="5"/><polygon points="386,300 414,300 400,318" fill="#156b8c"/><rect x="30" y="326" width="740" height="171" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="348" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="378" font-size="25" fill="#ffffff" font-weight="700">2</text><text x="106" y="366" font-size="27" fill="#156b8c" font-weight="700">轉換</text><text x="106" y="411" font-size="30" fill="#142b40" font-weight="400">val out = nums.filter { it % 2 == 0</text><text x="106" y="451" font-size="30" fill="#142b40" font-weight="400"> }</text><path d="M400 502 V520" stroke="#156b8c" stroke-width="5"/><polygon points="386,517 414,517 400,535" fill="#156b8c"/><rect x="30" y="543" width="740" height="131" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="565" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="595" font-size="25" fill="#ffffff" font-weight="700">3</text><text x="106" y="583" font-size="27" fill="#156b8c" font-weight="700">結果</text><text x="106" y="628" font-size="30" fill="#142b40" font-weight="400">val sum = out.sum()</text><rect x="30" y="698" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="732" font-size="26" fill="#604a1d" font-weight="400">filter保留符合條件的元素，並不就地刪除原清單。</text></g></svg>

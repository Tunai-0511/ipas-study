<svg xmlns="http://www.w3.org/2000/svg" width="800" height="965" viewBox="0 0 800 965" role="img" aria-labelledby="title desc"><title id="title">搜尋任務與取消</title><desc id="desc">搜尋任務與取消。欄位依序為：時間、事件。t0：Task A開始搜尋「高」；t1：使用者改搜「高雄」，Task B開始；t2：要求取消A；t3：A內部仍需檢查取消或處理拋錯。Swift任務取消採合作式；單純設定取消不等於所有工作立即終止。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">行動裝置程式設計實作-iOS開發實務｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">搜尋任務與取消</text><rect x="30" y="149" width="740" height="131" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="171" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="201" font-size="25" fill="#ffffff" font-weight="700">1</text><text x="106" y="189" font-size="27" fill="#156b8c" font-weight="700">t0</text><text x="106" y="234" font-size="30" fill="#142b40" font-weight="400">Task A開始搜尋「高」</text><path d="M400 285 V303" stroke="#156b8c" stroke-width="5"/><polygon points="386,300 414,300 400,318" fill="#156b8c"/><rect x="30" y="326" width="740" height="131" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="348" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="378" font-size="25" fill="#ffffff" font-weight="700">2</text><text x="106" y="366" font-size="27" fill="#156b8c" font-weight="700">t1</text><text x="106" y="411" font-size="30" fill="#142b40" font-weight="400">使用者改搜「高雄」，Task B開始</text><path d="M400 462 V480" stroke="#156b8c" stroke-width="5"/><polygon points="386,477 414,477 400,495" fill="#156b8c"/><rect x="30" y="503" width="740" height="131" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="525" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="555" font-size="25" fill="#ffffff" font-weight="700">3</text><text x="106" y="543" font-size="27" fill="#156b8c" font-weight="700">t2</text><text x="106" y="588" font-size="30" fill="#142b40" font-weight="400">要求取消A</text><path d="M400 639 V657" stroke="#156b8c" stroke-width="5"/><polygon points="386,654 414,654 400,672" fill="#156b8c"/><rect x="30" y="680" width="740" height="131" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="702" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="732" font-size="25" fill="#ffffff" font-weight="700">4</text><text x="106" y="720" font-size="27" fill="#156b8c" font-weight="700">t3</text><text x="106" y="765" font-size="30" fill="#142b40" font-weight="400">A內部仍需檢查取消或處理拋錯</text><rect x="30" y="835" width="740" height="104" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="869" font-size="26" fill="#604a1d" font-weight="400">Swift任務取消採合作式；單純設定取消不等於所有工作立即</text><text x="46" y="905" font-size="26" fill="#604a1d" font-weight="400">終止。</text></g></svg>

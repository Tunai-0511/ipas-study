<svg xmlns="http://www.w3.org/2000/svg" width="800" height="619" viewBox="0 0 800 619" role="img" aria-labelledby="title desc"><title id="title">登入流程測試案例</title><desc id="desc">登入流程測試案例。欄位依序為：案例、預期。成功：安全保存有效權杖並進入主畫面；使用者取消：停止流程且不顯示成功；權杖到期：處理重新認證；權杖更新失敗：保留可理解錯誤與重試路徑。測試需以可替換服務控制結果，不將真實權杖寫入日誌。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">行動裝置程式設計實作-iOS開發實務｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">登入流程測試案例</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">案例</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">預期</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">成功</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">安全保存有效權杖並進入主畫面</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">使用者取消</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">停止流程且不顯示成功</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">權杖到期</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">處理重新認證</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="427" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="470" font-size="30" fill="#142b40" font-weight="400">權杖更新失敗</text><text x="270" y="470" font-size="30" fill="#142b40" font-weight="400">保留可理解錯誤與重試路徑</text><path d="M30 497 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="525" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="559" font-size="26" fill="#604a1d" font-weight="400">測試需以可替換服務控制結果，不將真實權杖寫入日誌。</text></g></svg>

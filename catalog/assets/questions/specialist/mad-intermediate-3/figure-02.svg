<svg xmlns="http://www.w3.org/2000/svg" width="800" height="752" viewBox="0 0 800 752" role="img" aria-labelledby="title desc"><title id="title">更新畫面狀態的邊界</title><desc id="desc">更新畫面狀態的邊界。欄位依序為：步驟、安排。網路等待：非同步等待回應；CPU密集解析：避免長時間占用UI執行環境；更新可觀察UI狀態：遵循MainActor隔離。await不代表所有後續CPU工作會自動移到背景。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">行動裝置程式設計實作-iOS開發實務｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">更新畫面狀態的邊界</text><rect x="30" y="149" width="740" height="131" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="171" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="201" font-size="25" fill="#ffffff" font-weight="700">1</text><text x="106" y="189" font-size="27" fill="#156b8c" font-weight="700">網路等待</text><text x="106" y="234" font-size="30" fill="#142b40" font-weight="400">非同步等待回應</text><path d="M400 285 V303" stroke="#156b8c" stroke-width="5"/><polygon points="386,300 414,300 400,318" fill="#156b8c"/><rect x="30" y="326" width="740" height="131" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="348" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="378" font-size="25" fill="#ffffff" font-weight="700">2</text><text x="106" y="366" font-size="27" fill="#156b8c" font-weight="700">CPU密集解析</text><text x="106" y="411" font-size="30" fill="#142b40" font-weight="400">避免長時間占用UI執行環境</text><path d="M400 462 V480" stroke="#156b8c" stroke-width="5"/><polygon points="386,477 414,477 400,495" fill="#156b8c"/><rect x="30" y="503" width="740" height="131" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="525" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="555" font-size="25" fill="#ffffff" font-weight="700">3</text><text x="106" y="543" font-size="27" fill="#156b8c" font-weight="700">更新可觀察UI狀態</text><text x="106" y="588" font-size="30" fill="#142b40" font-weight="400">遵循MainActor隔離</text><rect x="30" y="658" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="692" font-size="26" fill="#604a1d" font-weight="400">await不代表所有後續CPU工作會自動移到背景。</text></g></svg>

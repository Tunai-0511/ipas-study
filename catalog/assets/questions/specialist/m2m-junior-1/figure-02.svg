<svg xmlns="http://www.w3.org/2000/svg" width="800" height="669" viewBox="0 0 800 669" role="img" aria-labelledby="title desc"><title id="title">資料與控制需求</title><desc id="desc">資料與控制需求。欄位依序為：工作、容許延遲、失效後果。每日能源報表：分鐘：報表延後；產線停止命令：依安全設計：可能影響人員設備；一般趨勢顯示：數秒：顯示暫停。是否屬安全功能、故障安全狀態由工程評估決定。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">智慧聯網與工控資安整合概論｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">資料與控制需求</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">工作</text><text x="245" y="190" font-size="28" fill="#ffffff" font-weight="700">容許延遲</text><text x="475" y="190" font-size="28" fill="#ffffff" font-weight="700">失效後果</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="110" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">每日能源報</text><text x="45" y="300" font-size="30" fill="#142b40" font-weight="400">表</text><text x="245" y="260" font-size="30" fill="#142b40" font-weight="400">分鐘</text><text x="475" y="260" font-size="30" fill="#142b40" font-weight="400">報表延後</text><path d="M30 327 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="327" width="740" height="110" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="370" font-size="30" fill="#142b40" font-weight="400">產線停止命</text><text x="45" y="410" font-size="30" fill="#142b40" font-weight="400">令</text><text x="245" y="370" font-size="30" fill="#142b40" font-weight="400">依安全設計</text><text x="475" y="370" font-size="30" fill="#142b40" font-weight="400">可能影響人員設備</text><path d="M30 437 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="437" width="740" height="110" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="480" font-size="30" fill="#142b40" font-weight="400">一般趨勢顯</text><text x="45" y="520" font-size="30" fill="#142b40" font-weight="400">示</text><text x="245" y="480" font-size="30" fill="#142b40" font-weight="400">數秒</text><text x="475" y="480" font-size="30" fill="#142b40" font-weight="400">顯示暫停</text><path d="M30 547 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="575" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="609" font-size="26" fill="#604a1d" font-weight="400">是否屬安全功能、故障安全狀態由工程評估決定。</text></g></svg>

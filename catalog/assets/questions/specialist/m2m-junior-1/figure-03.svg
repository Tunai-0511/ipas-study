<svg xmlns="http://www.w3.org/2000/svg" width="800" height="619" viewBox="0 0 800 619" role="img" aria-labelledby="title desc"><title id="title">閘道器資料轉送</title><desc id="desc">閘道器資料轉送。欄位依序為：介面、資料。下行設備：Modbus holding register；閘道器：單位轉換、時間戳、品質碼；上行平台：MQTT資料主題；網路中斷：本機緩衝及告警。PLC暫存器與上雲訊息格式不必相同。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">智慧聯網與工控資安整合概論｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">閘道器資料轉送</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">介面</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">資料</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">下行設備</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">Modbus holding register</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">閘道器</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">單位轉換、時間戳、品質碼</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">上行平台</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">MQTT資料主題</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="427" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="470" font-size="30" fill="#142b40" font-weight="400">網路中斷</text><text x="270" y="470" font-size="30" fill="#142b40" font-weight="400">本機緩衝及告警</text><path d="M30 497 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="525" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="559" font-size="26" fill="#604a1d" font-weight="400">PLC暫存器與上雲訊息格式不必相同。</text></g></svg>

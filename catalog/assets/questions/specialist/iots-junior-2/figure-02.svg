<svg xmlns="http://www.w3.org/2000/svg" width="800" height="619" viewBox="0 0 800 619" role="img" aria-labelledby="title desc"><title id="title">4–20mA電流迴路轉電壓</title><desc id="desc">4–20mA電流迴路轉電壓。欄位依序為：元件／狀態、數值。取樣電阻：250Ω；量測下限：4mA；量測上限：20mA；ADC容許範圍：0～3.3V。以V＝IR計算，需另檢查電阻功率與裝置能力。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">感測器信號調節實務應用｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">4–20mA電流迴路轉電壓</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">元件／狀態</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">數值</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">取樣電阻</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">250Ω</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">量測下限</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">4mA</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">量測上限</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">20mA</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="427" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="470" font-size="30" fill="#142b40" font-weight="400">ADC容許範圍</text><text x="270" y="470" font-size="30" fill="#142b40" font-weight="400">0～3.3V</text><path d="M30 497 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="525" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="559" font-size="26" fill="#604a1d" font-weight="400">以V＝IR計算，需另檢查電阻功率與裝置能力。</text></g></svg>

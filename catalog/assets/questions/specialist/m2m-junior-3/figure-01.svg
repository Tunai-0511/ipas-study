<svg xmlns="http://www.w3.org/2000/svg" width="800" height="619" viewBox="0 0 800 619" role="img" aria-labelledby="title desc"><title id="title">Modbus RTU 溫度讀取工作單</title><desc id="desc">Modbus RTU 溫度讀取工作單。欄位依序為：項目、設定。介面：RS-485，9600 baud，8E1；站號：7；功能碼：03：讀holding registers；資料：位址0，raw=238；單位0.1°C。設備手冊指定PDU位址0；不是文件標號40001直接填入PDU。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">智慧聯網基礎應用實作｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">Modbus RTU 溫度讀取工作單</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">項目</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">設定</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">介面</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">RS-485，9600 baud，8E1</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">站號</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">7</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">功能碼</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">03：讀holding registers</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="427" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="470" font-size="30" fill="#14
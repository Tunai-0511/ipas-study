<svg xmlns="http://www.w3.org/2000/svg" width="800" height="619" viewBox="0 0 800 619" role="img" aria-labelledby="title desc"><title id="title">現場讀值與故障記錄</title><desc id="desc">現場讀值與故障記錄。欄位依序為：檢查點、觀察。電源：感測器供電正常；實體介面：A/B端與接地依設備文件連接；通訊參數：主站8N1；從站8E1；上層狀態：持續逾時，無有效回應。維修時先使用安全隔離測試環境，不任意變更生產控制值。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">智慧聯網基礎應用實作｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">現場讀值與故障記錄</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">檢查點</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">觀察</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">電源</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">感測器供電正常</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">實體介面</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">A/B端與接地依設備文件連接</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">通訊參數</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">主站8N1；從站8E1</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="427" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="470" font-size="30" fill="#142b40" font-weight="400">上層狀態</text><text x="270" y="470" font-size="30" fill="#142b40" font-weight="400">持續逾時，無有效回應</text><path d="M30 497 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="525" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="559" font-size="26" fill="#604a1d" font-weight="400">維修時先使用安全隔離測試環境，不任意變更生產控制值。</text></g></svg>

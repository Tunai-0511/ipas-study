<svg xmlns="http://www.w3.org/2000/svg" width="800" height="549" viewBox="0 0 800 549" role="img" aria-labelledby="title desc"><title id="title">醫院導引：樓層與訊息層級</title><desc id="desc">醫院導引：樓層與訊息層級。欄位依序為：區域、主色、冗餘辨識。急診：紅色：急診文字＋十字圖形；門診：藍色：門診文字＋圓形；行政：灰色：行政文字＋方形。導引須在一般彩色與灰階列印中都可辨識。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">色彩計畫實務｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">醫院導引：樓層與訊息層級</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">區域</text><text x="245" y="190" font-size="28" fill="#ffffff" font-weight="700">主色</text><text x="475" y="190" font-size="28" fill="#ffffff" font-weight="700">冗餘辨識</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">急診</text><text x="245" y="260" font-size="30" fill="#142b40" font-weight="400">紅色</text><text x="475" y="260" font-size="30" fill="#142b40" font-weight="400">急診文字＋十字圖形</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">門診</text><text x="245" y="330" font-size="30" fill="#142b40" font-weight="400">藍色</text><text x="475" y="330" font-size="30" fill="#142b40" font-weight="400">門診文字＋圓形</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">行政</text><text x="245" y="400" font-size="30" fill="#142b40" font-weight="400">灰色</text><text x="475" y="400" font-size="30" fill="#142b40" font-weight="400">行政文字＋方形</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="455" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="489" font-size="26" fill="#604a1d" font-weight="400">導引須在一般彩色與灰階列印中都可辨識。</text></g></svg>

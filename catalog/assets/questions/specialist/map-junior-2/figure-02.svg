<svg xmlns="http://www.w3.org/2000/svg" width="800" height="659" viewBox="0 0 800 659" role="img" aria-labelledby="title desc"><title id="title">5位使用者的原型測試</title><desc id="desc">5位使用者的原型測試。欄位依序為：項目、觀測。成功完成：4人；其中需主持人提示：2人；未完成：1人；共同卡點：3人找不到返回編輯。無協助成功指完成任務且沒有主持人提示。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">行動應用企劃實務｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">5位使用者的原型測試</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">項目</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">觀測</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">成功完成</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">4人</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="110" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">其中需主持人</text><text x="45" y="370" font-size="30" fill="#142b40" font-weight="400">提示</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">2人</text><path d="M30 397 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="397" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="440" font-size="30" fill="#142b40" font-weight="400">未完成</text><text x="270" y="440" font-size="30" fill="#142b40" font-weight="400">1人</text><path d="M30 467 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="467" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="510" font-size="30" fill="#142b40" font-weight="400">共同卡點</text><text x="270" y="510" font-size="30" fill="#142b40" font-weight="400">3人找不到返回編輯</text><path d="M30 537 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="565" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="599" font-size="26" fill="#604a1d" font-weight="400">無協助成功指完成任務且沒有主持人提示。</text></g></svg>

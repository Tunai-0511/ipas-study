<svg xmlns="http://www.w3.org/2000/svg" width="800" height="669" viewBox="0 0 800 669" role="img" aria-labelledby="title desc"><title id="title">有限工期的改善清單</title><desc id="desc">有限工期的改善清單。欄位依序為：項目、影響／工作量。甲：返回編輯入口：3人受阻／1天；乙：成功畫面動畫：無任務阻礙／3天；丙：斷網保留草稿：可能丟失輸入／2天。改善工期3天；本次以完成任務與避免資料流失為優先。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">行動應用企劃實務｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">有限工期的改善清單</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">項目</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">影響／工作量</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="110" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">甲：返回編輯</text><text x="45" y="300" font-size="30" fill="#142b40" font-weight="400">入口</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">3人受阻／1天</text><path d="M30 327 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="327" width="740" height="110" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="370" font-size="30" fill="#142b40" font-weight="400">乙：成功畫面</text><text x="45" y="410" font-size="30" fill="#142b40" font-weight="400">動畫</text><text x="270" y="370" font-size="30" fill="#142b40" font-weight="400">無任務阻礙／3天</text><path d="M30 437 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="437" width="740" height="110" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="480" font-size="30" fill="#142b40" font-weight="400">丙：斷網保留</text><text x="45" y="520" font-size="30" fill="#142b40" font-weight="400">草稿</text><text x="270" y="480" font-size="30" fill="#142b40" font-weight="400">可能丟失輸入／2天</text><path d="M30 547 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="575" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="609" font-size="26" fill="#604a1d" font-weight="400">改善工期3天；本次以完成任務與避免資料流失為優先。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="549" viewBox="0 0 800 549" role="img" aria-labelledby="title desc"><title id="title">模型複雜度與錯誤率</title><desc id="desc">模型複雜度與錯誤率。欄位依序為：模型、訓練／驗證錯誤率。甲：過簡單：30%／32%；乙：適中：10%／12%；丙：極複雜：0%／35%。三者使用相同切割與同一錯誤率定義。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">機器學習概論｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">模型複雜度與錯誤率</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">模型</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">訓練／驗證錯誤率</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">甲：過簡單</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">30%／32%</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">乙：適中</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">10%／12%</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">丙：極複雜</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">0%／35%</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="455" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="489" font-size="26" fill="#604a1d" font-weight="400">三者使用相同切割與同一錯誤率定義。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="549" viewBox="0 0 800 549" role="img" aria-labelledby="title desc"><title id="title">學習任務與資料</title><desc id="desc">學習任務與資料。欄位依序為：任務、可取得資料。A：房租預測：房屋特徵與實際租金；B：顧客分群：行為特徵，無群組標籤；C：垃圾郵件：文字特徵與垃圾／正常標籤。依目標與標籤判斷任務，不以資料大小命名方法。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">機器學習概論｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">學習任務與資料</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">任務</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">可取得資料</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">A：房租預測</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">房屋特徵與實際租金</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">B：顧客分群</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">行為特徵，無群組標籤</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">C：垃圾郵件</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">文字特徵與垃圾／正常標籤</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="455" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="489" font-size="26" fill="#604a1d" font-weight="400">依目標與標籤判斷任務，不以資料大小命名方法。</text></g></svg>

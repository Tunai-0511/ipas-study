<svg xmlns="http://www.w3.org/2000/svg" width="800" height="479" viewBox="0 0 800 479" role="img" aria-labelledby="title desc"><title id="title">兩組日需求量</title><desc id="desc">兩組日需求量。欄位依序為：資料組、由小到大數值。甲：2, 3, 3, 4, 8；乙：2, 3, 3, 4, 80。每組5筆；比較平均數、中位數與離群值敏感度。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">資料處理與分析概論｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">兩組日需求量</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">資料組</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">由小到大數值</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">甲</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">2, 3, 3, 4, 8</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">乙</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">2, 3, 3, 4, 80</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="385" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="419" font-size="26" fill="#604a1d" font-weight="400">每組5筆；比較平均數、中位數與離群值敏感度。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="792" viewBox="0 0 800 792" role="img" aria-labelledby="title desc"><title id="title">Python 缺漏資料處理</title><desc id="desc">Python 缺漏資料處理。欄位依序為：程式位置、內容。輸入：xs = [2, None, 4, 0]；有效值：ys = [x for x in xs if x is not None]；結果：total = sum(ys)。None 表示缺漏；0 是有效觀測值。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">資料導向程式設計｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">Python 缺漏資料處理</text><rect x="30" y="149" width="740" height="131" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="171" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="201" font-size="25" fill="#ffffff" font-weight="700">1</text><text x="106" y="189" font-size="27" fill="#156b8c" font-weight="700">輸入</text><text x="106" y="234" font-size="30" fill="#142b40" font-weight="400">xs = [2, None, 4, 0]</text><path d="M400 285 V303" stroke="#156b8c" stroke-width="5"/><polygon points="386,300 414,300 400,318" fill="#156b8c"/><rect x="30" y="326" width="740" height="171" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="348" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="378" font-size="25" fill="#ffffff" font-weight="700">2</text><text x="106" y="366" font-size="27" fill="#156b8c" font-weight="700">有效值</text><text x="106" y="411" font-size="30" fill="#142b40" font-weight="400">ys = [x for x in xs if x is not </text><text x="106" y="451" font-size="30" fill="#142b40" font-weight="400">None]</text><path d="M400 502 V520" stroke="#156b8c" stroke-width="5"/><polygon points="386,517 414,517 400,535" fill="#156b8c"/><rect x="30" y="543" width="740" height="131" rx="14" fill="#edf5fa" stroke="#b9cedd"/><rect x="46" y="565" width="42" height="42" rx="21" fill="#156b8c" stroke="none"/><text x="58" y="595" font-size="25" fill="#ffffff" font-weight="700">3</text><text x="106" y="583" font-size="27" fill="#156b8c" font-weight="700">結果</text><text x="106" y="628" font-size="30" fill="#142b40" font-weight="400">total = sum(ys)</text><rect x="30" y="698" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="732" font-size="26" fill="#604a1d" font-weight="400">None 表示缺漏；0 是有效觀測值。</text></g></svg>

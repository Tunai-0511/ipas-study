<svg xmlns="http://www.w3.org/2000/svg" width="800" height="669" viewBox="0 0 800 669" role="img" aria-labelledby="title desc"><title id="title">訂單與客戶資料</title><desc id="desc">訂單與客戶資料。欄位依序為：資料表、資料列。orders：(id=1, customer=7), (id=2, customer=9)；customers：(id=7, name=甲), (id=7, name=乙)；連接條件：orders.customer = customers.id。此客戶表刻意含重複鍵，用於檢查連接基數。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">資料導向程式設計｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">訂單與客戶資料</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">資料表</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">資料列</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="110" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">orders</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">(id=1, customer=7), (id=2, </text><text x="270" y="300" font-size="30" fill="#142b40" font-weight="400">customer=9)</text><path d="M30 327 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="327" width="740" height="110" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="370" font-size="30" fill="#142b40" font-weight="400">customers</text><text x="270" y="370" font-size="30" fill="#142b40" font-weight="400">(id=7, name=甲), (id=7, </text><text x="270" y="410" font-size="30" fill="#142b40" font-weight="400">name=乙)</text><path d="M30 437 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="437" width="740" height="110" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="480" font-size="30" fill="#142b40" font-weight="400">連接條件</text><text x="270" y="480" font-size="30" fill="#142b40" font-weight="400">orders.customer = customers</text><text x="270" y="520" font-size="30" fill="#142b40" font-weight="400">.id</text><path d="M30 547 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="575" width="740" height="68" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="609" font-size="26" fill="#604a1d" font-weight="400">此客戶表刻意含重複鍵，用於檢查連接基數。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="585" viewBox="0 0 800 585" role="img" aria-labelledby="title desc"><title id="title">CSV 欄位清理規則</title><desc id="desc">CSV 欄位清理規則。欄位依序為：原始欄位、指定規則。customer_id：字串；保留前導零，如 0012；amount：去空白後轉數值；空白視為缺漏；order_id：交易唯一鍵；重送應去重。原始列：order_id=R8, customer_id=0012, amount=&quot; 10.5 &quot;。</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="30" y="45" font-size="22" fill="#4f6576" font-weight="400">資料導向程式設計｜自編練習資料</text><text x="30" y="85" font-size="34" fill="#102c44" font-weight="700">CSV 欄位清理規則</text><rect x="30" y="149" width="740" height="68" rx="0" fill="#153e58" stroke="none"/><text x="45" y="190" font-size="28" fill="#ffffff" font-weight="700">原始欄位</text><text x="270" y="190" font-size="28" fill="#ffffff" font-weight="700">指定規則</text><path d="M30 217 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="217" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="260" font-size="30" fill="#142b40" font-weight="400">customer_id</text><text x="270" y="260" font-size="30" fill="#142b40" font-weight="400">字串；保留前導零，如 0012</text><path d="M30 287 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="287" width="740" height="70" rx="0" fill="#ffffff" stroke="none"/><text x="45" y="330" font-size="30" fill="#142b40" font-weight="400">amount</text><text x="270" y="330" font-size="30" fill="#142b40" font-weight="400">去空白後轉數值；空白視為缺漏</text><path d="M30 357 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="357" width="740" height="70" rx="0" fill="#eef5f9" stroke="none"/><text x="45" y="400" font-size="30" fill="#142b40" font-weight="400">order_id</text><text x="270" y="400" font-size="30" fill="#142b40" font-weight="400">交易唯一鍵；重送應去重</text><path d="M30 427 H770" stroke="#cad9e3" stroke-width="1"/><rect x="30" y="455" width="740" height="104" rx="12" fill="#fff5df" stroke="none"/><text x="46" y="489" font-size="26" fill="#604a1d" font-weight="400">原始列：order_id=R8, customer_id=0012, amount=&quot;</text><text x="46" y="525" font-size="26" fill="#604a1d" font-weight="400"> 10.5 &quot;。</text></g></svg>
